services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      # Ollama runs on the host, outside Docker.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      OLLAMA_REPLIES: ${OLLAMA_REPLIES:-false}
      LAW_INDEX_PATH: /law_index/laws.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ${LAW_INDEX_DIR:-../rag law/RAD law/data/index}:/law_index:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; Docker Desktop provides it already
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
