# Production: HTTPS via Caddy, nothing but 80/443 exposed, no auto-reload.
#   DOMAIN=tax.example.ge docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Put DOMAIN (and the rest of your settings) in .env on the server.
services:
  db:
    ports: !reset []
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports: !reset []
    volumes: !reset
      - ${LAW_INDEX_DIR:-../rag law/RAD law/data/index}:/law_index:ro
    environment:
      SESSION_COOKIE_SECURE: "true"
      PUBLIC_URL: https://${DOMAIN}
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
