<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Georgian AI Accountant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%239f1d35'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'>₾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4f1; --surface: #ffffff; --surface-2: #faf8f6; --ink: #1c1917; --muted: #78716c; --faint: #a8a29e;
    --border: #e7e2dc; --accent: #9f1d35; --accent-ink: #ffffff; --accent-soft: #f8e9ec;
    --ok: #15803d; --ok-soft: #e7f5ec; --warn: #b45309; --warn-soft: #fdf1e0; --info: #57534e; --info-soft: #f1efec;
    --demo: #6d28d9; --demo-soft: #efe9fb;
    --shadow: 0 1px 2px rgb(28 25 23 / .04), 0 4px 16px rgb(28 25 23 / .06);
    --radius: 14px;
    --font: "Inter", "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131110; --surface: #1c1a18; --surface-2: #211e1c; --ink: #f3efeb; --muted: #a8a29e; --faint: #78716c;
      --border: #2f2b28; --accent: #e0677f; --accent-ink: #1c1917; --accent-soft: #3a1f26;
      --ok: #4ade80; --ok-soft: #173222; --warn: #fbbf24; --warn-soft: #3a2c12; --info: #d6d3d1; --info-soft: #292524;
      --demo: #b79cf5; --demo-soft: #2a2140;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131110; --surface: #1c1a18; --surface-2: #211e1c; --ink: #f3efeb; --muted: #a8a29e; --faint: #78716c;
    --border: #2f2b28; --accent: #e0677f; --accent-ink: #1c1917; --accent-soft: #3a1f26;
    --ok: #4ade80; --ok-soft: #173222; --warn: #fbbf24; --warn-soft: #3a2c12; --info: #d6d3d1; --info-soft: #292524;
    --demo: #b79cf5; --demo-soft: #2a2140;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  .app { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 100%; height: 100vh; height: 100dvh; overflow: hidden; }

  /* ---------- sidebar ---------- */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 18px; display: flex;
    flex-direction: column; gap: 22px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 11px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-size: 22px; font-weight: 600; flex: none; }
  .brand h1 { font-size: 15px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .brand p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
  .section-label { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 8px; }
  .field { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; outline: none; transition: border-color .15s; }
  .field:focus { border-color: var(--accent); }
  .profile { margin-top: 10px; border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface-2);
    display: grid; gap: 8px; font-size: 13px; }
  .profile-row { display: flex; justify-content: space-between; gap: 8px; }
  .profile-row span:first-child { color: var(--muted); }
  .profile-row span:last-child { font-weight: 500; text-align: right; }
  .suggestions { display: grid; gap: 6px; }
  .suggestion { text-align: left; background: transparent; border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-size: 13.5px; cursor: pointer; transition: background .15s, border-color .15s; }
  .suggestion:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sidebar-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12.5px; color: var(--muted); }
  .icon-btn { background: transparent; border: 1px solid var(--border); border-radius: 9px; width: 34px; height: 34px;
    display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .icon-btn:hover { color: var(--ink); border-color: var(--faint); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--faint); margin-right: 6px; }
  .dot.on { background: var(--ok); }

  /* ---------- chat ---------- */
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); }
  .topbar h2 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .menu-btn { display: none; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px;
    font-weight: 500; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
  .pill .dot { margin: 0; }
  .pill.ai { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--border)); background: var(--ok-soft); }
  .pill.ai .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }

  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 24px 12px; scroll-behavior: smooth; }
  .thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .empty { text-align: center; padding: 8vh 12px 0; }
  .empty .logo { width: 56px; height: 56px; font-size: 30px; border-radius: 16px; margin: 0 auto 18px; }
  .empty h3 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 6px; font-weight: 650; }
  .empty p { color: var(--muted); margin: 0 auto 26px; max-width: 460px; }
  .empty-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 620px; margin: 0 auto; }
  .empty-card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
  .empty-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .empty-card strong { display: block; font-size: 13px; color: var(--accent); margin-bottom: 3px; font-weight: 600; }
  .empty-card span { font-size: 14px; }

  .row { display: flex; gap: 12px; align-items: flex-start; animation: rise .25s ease-out; }
  .row.user { justify-content: flex-end; }
  .row.restored { animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .avatar { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-size: 17px; font-weight: 600; flex: none; }
  .bubble-user { background: var(--accent); color: var(--accent-ink); padding: 10px 15px; border-radius: 16px 16px 4px 16px;
    max-width: min(560px, 85%); white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot-body { flex: 1; min-width: 0; display: grid; gap: 12px; }
  .reply { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15.5px; line-height: 1.6; }
  .divider { text-align: center; font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px;
    box-shadow: var(--shadow); display: grid; gap: 10px; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--info); }
  .card.applies::before { background: var(--accent); }
  .card.insufficient_data::before { background: var(--warn); }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .card-title { font-weight: 600; font-size: 15px; flex: 1; min-width: 160px; }
  .badge { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; letter-spacing: .01em; white-space: nowrap; }
  .badge.applies { background: var(--accent-soft); color: var(--accent); }
  .badge.not_applicable { background: var(--info-soft); color: var(--info); }
  .badge.insufficient_data { background: var(--warn-soft); color: var(--warn); }
  .badge.demo { background: var(--demo-soft); color: var(--demo); }
  .badge.unverified { background: var(--warn-soft); color: var(--warn); }
  .badge.verified { background: var(--ok-soft); color: var(--ok); }
  .amount { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .amount-label { font-size: 12.5px; color: var(--muted); margin-bottom: -6px; }
  .breakdown { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .breakdown td { padding: 6px 0; border-top: 1px solid var(--border); }
  .breakdown td:last-child { text-align: right; font-weight: 500; white-space: nowrap; padding-left: 12px; }
  .breakdown tr:last-child td { font-weight: 600; }
  .amount small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .card p { margin: 0; color: var(--ink); }
  .source { font-size: 12.5px; color: var(--muted); }
  .source code { font-family: var(--mono); font-size: 11.5px; }
  details { border-top: 1px dashed var(--border); padding-top: 8px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); list-style: none; display: flex;
    align-items: center; gap: 6px; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 16px; line-height: 1; }
  details[open] summary::before { transform: rotate(90deg); }
  summary:hover { color: var(--ink); }
  blockquote { margin: 8px 0 6px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--surface-2);
    border-radius: 0 10px 10px 0; font-size: 13.5px; white-space: pre-wrap; color: var(--ink); }
  .cite-link { font-size: 12.5px; text-decoration: none; font-weight: 500; }
  .cite-link:hover { text-decoration: underline; }
  .trace { margin: 8px 0 0; padding-left: 20px; font-family: var(--mono); font-size: 12px; color: var(--muted); display: grid; gap: 3px; }

  .callout { border-radius: 12px; padding: 12px 14px; font-size: 14px; display: grid; gap: 8px; }
  .callout.questions { background: var(--warn-soft); }
  .callout.questions strong { color: var(--warn); font-size: 13px; }
  .callout ul { margin: 0; padding-left: 18px; }
  .callout.warning { background: var(--warn-soft); color: var(--warn); font-size: 12.5px; padding: 8px 12px; }
  .callout.error { background: var(--accent-soft); color: var(--accent); }
  .meta { font-size: 12px; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap; }
  .meta .debug-toggle { background: none; border: none; padding: 0; color: inherit; cursor: pointer; text-decoration: underline; }
  .debug { font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }

  .typing { display: inline-flex; gap: 5px; padding: 12px 4px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  /* ---------- composer ---------- */
  .composer-wrap { padding: 12px 24px 18px; }
  .composer { max-width: 780px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px;
    transition: border-color .15s; }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea { flex: 1; border: none; outline: none; background: transparent; resize: none; padding: 8px 0;
    max-height: 180px; min-height: 24px; line-height: 1.5; }
  .send { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; cursor: pointer; flex: none; transition: opacity .15s, transform .1s; }
  .send:active { transform: scale(.95); }
  .send:disabled { opacity: .35; cursor: default; }
  .fineprint { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 11.5px; color: var(--faint); }

  .scrim { display: none; }

  /* ---------- sidebar: new chat, history, account ---------- */
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 12px; cursor: pointer;
    font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, border-color .15s; }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.primary:disabled { opacity: .6; cursor: default; }
  .btn.block { width: 100%; }
  .btn.small { padding: 4px 9px; font-size: 12.5px; border-radius: 8px; }
  .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .label-row .section-label { margin: 0; }
  .history { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; margin: 0 -6px; }
  .history-item { display: flex; align-items: center; gap: 6px; border-radius: 9px; padding: 7px 8px 7px 10px; cursor: pointer;
    border: 1px solid transparent; }
  .history-item:hover { background: var(--surface-2); }
  .history-item.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .history-item .h-text { flex: 1; min-width: 0; }
  .history-item .h-title { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item .h-time { font-size: 11.5px; color: var(--faint); }
  .history-item .h-del { opacity: 0; border: none; background: none; color: var(--faint); cursor: pointer; padding: 4px; border-radius: 6px;
    line-height: 0; }
  .history-item:hover .h-del, .history-item .h-del:focus-visible { opacity: 1; }
  .history-item .h-del:hover { color: var(--accent); background: var(--surface); }
  @media (hover: none) { .history-item .h-del { opacity: 1; } }
  .history-empty { font-size: 13px; color: var(--faint); padding: 2px 6px; }
  .account { display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--border); }
  .initials { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 12.5px; font-weight: 600; flex: none; }
  .account .who { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
  .account .who div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .account .who div:last-child { color: var(--faint); font-size: 12px; }
  .context-note { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 7px 14px;
    font-size: 13.5px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s, background .15s; text-align: left; }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- deadlines ---------- */
  .deadlines { display: grid; gap: 6px; }
  .deadline { display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); border-left: 3px solid var(--faint); }
  .deadline.overdue { border-left-color: var(--accent); }
  .deadline.due_soon { border-left-color: var(--warn); }
  .deadline.done { opacity: .6; }
  .deadline.done .d-title { text-decoration: line-through; }
  .deadline input { margin-top: 3px; accent-color: var(--accent); cursor: pointer; }
  .deadline .d-text { flex: 1; min-width: 0; }
  .deadline .d-title { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .deadline .d-when { font-size: 12px; color: var(--muted); }
  .deadline.overdue .d-when { color: var(--accent); font-weight: 500; }
  .deadline.due_soon .d-when { color: var(--warn); font-weight: 500; }
  .deadlines-empty { font-size: 12.5px; color: var(--faint); padding: 2px 4px; line-height: 1.45; }
  .profile .profile-actions { display: flex; justify-content: flex-end; }

  /* ---------- auth screen ---------- */
  .auth { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 20px;
    overflow-y: auto; }
  .auth[hidden] { display: none; }
  .auth-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    box-shadow: var(--shadow); padding: 30px 28px; }
  .auth-card .logo { margin: 0 auto 16px; width: 52px; height: 52px; font-size: 28px; border-radius: 15px; }
  .auth-card h1 { text-align: center; font-size: 21px; margin: 0 0 4px; letter-spacing: -.01em; }
  .auth-card > p { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 11px; padding: 3px; margin-bottom: 18px; }
  .tabs button { border: none; background: none; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .form-grid { display: grid; gap: 12px; }
  .form-grid label { display: grid; gap: 5px; font-size: 13px; font-weight: 500; }
  .form-grid label[hidden] { display: none; }
  .form-grid .check { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 14px; }
  .form-grid .hint-text { font-size: 12px; color: var(--faint); font-weight: 400; }
  .form-error { color: var(--accent); font-size: 13px; min-height: 18px; margin: 0; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---------- dialog ---------- */
  dialog { border: 1px solid var(--border); border-radius: 18px; padding: 24px; width: min(460px, calc(100vw - 32px));
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog h3 { margin: 0; font-size: 18px; }
  dialog .form-grid > p { margin: -6px 0 6px; color: var(--muted); font-size: 13.5px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: min(310px, 86vw); z-index: 20; transform: translateX(-100%);
      transition: transform .25s ease; box-shadow: var(--shadow); }
    .app.drawer-open .sidebar { transform: none; }
    .app.drawer-open .scrim { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 10; }
    .menu-btn { display: grid; }
    .topbar, #log, .composer-wrap { padding-left: 16px; padding-right: 16px; }
    .empty-grid { grid-template-columns: 1fr; }
    .pill .label-long { display: none; }
  }

  /* ---------- language picker ---------- */
  /* Status on its own line: long Georgian/Russian labels would otherwise squeeze the buttons out. */
  .sidebar-foot { flex-direction: column; align-items: stretch; gap: 10px; }
  .foot-actions { display: flex; align-items: center; gap: 6px; }
  .foot-actions { justify-content: flex-end; }
  .lang-menu { position: relative; flex: none; }
  .lang-trigger { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 9px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer;
    font-size: 13px; font-weight: 500; transition: border-color .15s, box-shadow .15s; }
  .lang-trigger:hover { border-color: var(--faint); }
  .lang-trigger:focus-visible, .lang-menu.open .lang-trigger { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .chevron { width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted);
    transform: translateY(-2px) rotate(45deg); transition: transform .2s; margin-left: 2px; }
  .lang-menu.open .chevron { transform: translateY(1px) rotate(225deg); }
  .flag { width: 20px; height: 14px; border-radius: 3px; object-fit: cover; flex: none;
    box-shadow: 0 0 0 1px rgb(0 0 0 / .12); }
  .lang-list { position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; min-width: 220px; padding: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 32px rgb(0 0 0 / .14), 0 2px 6px rgb(0 0 0 / .06);
    display: grid; gap: 2px; opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.98); transform-origin: top right;
    transition: opacity .16s ease, transform .16s ease, visibility 0s linear .16s; }
  .lang-menu.open .lang-list { opacity: 1; visibility: visible; transform: none; transition: opacity .16s ease, transform .16s ease; }
  .lang-option { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border: none; border-radius: 9px;
    background: transparent; color: var(--ink); cursor: pointer; text-align: left; transition: background .12s; }
  .lang-option:hover, .lang-option:focus-visible { background: var(--surface-2); outline: none; }
  .lang-option[aria-selected="true"] { background: var(--accent-soft); }
  .lang-option .flag { width: 24px; height: 17px; border-radius: 4px; }
  .lang-names { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
  .lang-native { font-size: 14px; font-weight: 600; }
  .lang-local { font-size: 12px; color: var(--muted); }
  .lang-check { width: 16px; color: var(--accent); font-weight: 700; text-align: center; }
  @media (max-width: 860px) { .topbar .lang-current { display: none; } .topbar .lang-trigger { padding: 0 9px; } }
  .auth-top { display: flex; justify-content: flex-end; margin: -12px -8px 4px 0; }
</style>

</head>
<body>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* storage unavailable */ } },
};

/* ---------- i18n ---------- */
// Interface text lives in /static/i18n.json; chat replies come translated from the server.
const LANGS = ["ka", "en", "ru", "de", "fr"];
let I18N = {};
let lang = "ka";

function lookup(key, l = lang) {
  const catalog = I18N[l] || {};
  return key in catalog ? catalog[key] : (I18N.en || {})[key] ?? key;
}
const fill = (text, vars) => String(text).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
function t(key, vars = {}, l = lang) { return fill(lookup(key, l), vars); }
const localeOf = (l = lang) => lookup("meta.locale", l);
function tp(key, n, l = lang) {
  const forms = lookup(key, l);
  const form = forms[new Intl.PluralRules(localeOf(l)).select(n)] ?? forms.other ?? forms.many ?? Object.values(forms)[0];
  return fill(form, { n });
}
// Rule/deadline text from the server may be a plain string or {"en": ..., "ka": ...}.
const loc = (text, l = lang) =>
  text === null || text === undefined || typeof text === "string" ? text : (text[l] || text.en || Object.values(text)[0]);

function initialLanguage() {
  const saved = store.get("lang");
  if (LANGS.includes(saved)) return saved;
  for (const pref of navigator.languages || [navigator.language || ""]) {
    const code = pref.toLowerCase().split("-")[0];
    if (LANGS.includes(code)) return code;
  }
  return "ka";
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t("app.name");
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
  for (const node of document.querySelectorAll("[data-i18n-placeholder]")) node.placeholder = t(node.dataset.i18nPlaceholder);
  for (const node of document.querySelectorAll("[data-i18n-aria]")) node.setAttribute("aria-label", t(node.dataset.i18nAria));
  for (const node of document.querySelectorAll("[data-i18n-title]")) {
    node.title = t(node.dataset.i18nTitle);
    node.setAttribute("aria-label", node.title);
  }
  renderLangMenus();
}

async function setLanguage(next, { save = true } = {}) {
  if (!LANGS.includes(next)) return;
  lang = next;
  store.set("lang", next);
  applyStatic();
  setAuthMode(authMode);
  renderStatus();
  renderProfile();
  renderDeadlines();
  renderHistory();
  if ($("thread").querySelector(".empty.start")) renderEmpty();
  else if ($("thread").querySelector(".empty.welcome")) renderWelcome();
  if (!companies.length && user) $("title").textContent = t("noCompany.title");
  if (save && user) {
    try { await api("/auth/me", { method: "PATCH", body: { language: next } }); } catch { /* kept locally anyway */ }
  }
}

/* ---------- language menu ---------- */
// Flags are inline SVG images: Windows doesn't render flag emoji (it shows "GE" instead of 🇬🇪).
const svgData = (svg) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
const cross = (x, y) => `<path d="M${x - 0.6} ${y - 2.2}h1.2v1.6h1.6v1.2h-1.6v1.6h-1.2v-1.6h-1.6v-1.2h1.6z" fill="#e8112d"/>`;
const FLAGS = {
  ka: svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/>
    <path d="M13 0h4v20h-4zM0 8h30v4H0z" fill="#e8112d"/>${cross(6.5, 4)}${cross(23.5, 4)}${cross(6.5, 16)}${cross(23.5, 16)}</svg>`),
  en: svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30"><clipPath id="c"><path d="M0 0v30h60V0z"/></clipPath>
    <clipPath id="d"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#c)"><path d="M0 0v30h60V0z" fill="#012169"/>
    <path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#d)" stroke="#c8102e" stroke-width="4"/>
    <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/></g></svg>`),
  ru: svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 6"><path fill="#fff" d="M0 0h9v2H0z"/>
    <path fill="#0039a6" d="M0 2h9v2H0z"/><path fill="#d52b1e" d="M0 4h9v2H0z"/></svg>`),
  de: svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5 3"><path d="M0 0h5v1H0z"/>
    <path fill="#dd0000" d="M0 1h5v1H0z"/><path fill="#ffce00" d="M0 2h5v1H0z"/></svg>`),
  fr: svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><path fill="#002395" d="M0 0h1v2H0z"/>
    <path fill="#fff" d="M1 0h1v2H1z"/><path fill="#ed2939" d="M2 0h1v2H2z"/></svg>`),
};
const flag = (l) => el("img", { class: "flag", src: FLAGS[l], alt: "", width: 20, height: 14 });

let openMenu = null;

function closeLangMenu({ focus = false } = {}) {
  if (!openMenu) return;
  const menu = openMenu;
  openMenu = null;
  menu.classList.remove("open");
  const trigger = menu.querySelector(".lang-trigger");
  trigger.setAttribute("aria-expanded", "false");
  if (focus) trigger.focus();
}

function openLangMenu(menu) {
  closeLangMenu();
  openMenu = menu;
  menu.classList.add("open");
  menu.querySelector(".lang-trigger").setAttribute("aria-expanded", "true");
  (menu.querySelector(".lang-option[aria-selected=true]") || menu.querySelector(".lang-option")).focus();
}

function renderLangMenu(menu) {
  const names = lookup("lang.names");
  const list = el("div", { class: "lang-list", role: "listbox", "aria-label": t("lang.label") },
    LANGS.map((l) => {
      const native = lookup("meta.native", l);
      const local = names[l];
      const option = el("button", { class: "lang-option", type: "button", role: "option", "aria-selected": String(l === lang),
          lang: l, onclick: () => { closeLangMenu({ focus: true }); setLanguage(l); } },
        flag(l),
        el("span", { class: "lang-names" },
          el("span", { class: "lang-native", text: native }),
          local && local.toLowerCase() !== native.toLowerCase() ? el("span", { class: "lang-local", text: local, lang }) : null),
        el("span", { class: "lang-check", "aria-hidden": "true", text: l === lang ? "✓" : "" }));
      return option;
    }));
  const trigger = el("button", { class: "lang-trigger", type: "button", "aria-haspopup": "listbox", "aria-expanded": "false",
      title: t("lang.label"), "aria-label": `${t("lang.label")}: ${lookup("meta.native")}`,
      onclick: (e) => { e.stopPropagation(); menu.classList.contains("open") ? closeLangMenu() : openLangMenu(menu); } },
    flag(lang), el("span", { class: "lang-current", text: lookup("meta.native") }),
    el("span", { class: "chevron", "aria-hidden": "true" }));
  list.addEventListener("keydown", (e) => {
    const options = [...list.querySelectorAll(".lang-option")];
    const i = options.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      options[(i + (e.key === "ArrowDown" ? 1 : options.length - 1)) % options.length].focus();
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      options[e.key === "Home" ? 0 : options.length - 1].focus();
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeLangMenu({ focus: true });
    } else if (e.key === "Tab") {
      closeLangMenu();
    }
  });
  const reopen = menu.classList.contains("open");
  menu.replaceChildren(trigger, list);
  if (reopen) openLangMenu(menu);
}

function renderLangMenus() {
  for (const menu of document.querySelectorAll(".lang-menu")) renderLangMenu(menu);
}
document.addEventListener("click", (e) => { if (openMenu && !openMenu.contains(e.target)) closeLangMenu(); });

/* ---------- formatting ---------- */
// Formats come from the catalog rather than the browser's Intl data, which lacks Georgian in some builds,
// and match the server's replies exactly.
function formatAmount(value, l = lang) {
  const text = String(value);
  if (!/^-?\d+(\.\d+)?$/.test(text)) return text;
  // Display only: the engine's exact digits with this language's separators.
  const [whole, frac] = text.replace(/^-/, "").split(".");
  const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, lookup("number.group", l));
  return (text.startsWith("-") ? "-" : "") + grouped + (frac ? lookup("number.decimal", l) + frac : "");
}
const ymd = (iso) => iso.slice(0, 10).split("-").map(Number);
function shortDate(iso) {
  const [, m, d] = ymd(iso);
  return t("date.short", { day: d, month: lookup("date.monthsShort")[m - 1] });
}
function monthYear(iso) {
  const [y, m] = ymd(iso);
  return t("date.monthYear", { month: lookup("date.months")[m - 1], year: y });
}
function fullDate(date) {
  const day = lang === "fr" && date.getDate() === 1 ? "1er" : date.getDate();
  return t("date.full", { day, month: lookup("date.monthsGenitive")[date.getMonth()], year: date.getFullYear() });
}

let companies = [];
let busy = false;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children.flat()) if (child) node.append(child);
  return node;
}

function scrollDown() { $("log").scrollTop = $("log").scrollHeight; }

/* ---------- theme ---------- */
function applyTheme(theme) {
  if (theme) document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
}
applyTheme(store.get("theme"));
$("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  applyTheme(next);
  store.set("theme", next);
});

/* ---------- drawer (mobile) ---------- */
$("menuBtn").addEventListener("click", () => $("app").classList.add("drawer-open"));
$("scrim").addEventListener("click", () => $("app").classList.remove("drawer-open"));

/* ---------- empty states ---------- */
function ask(text) {
  $("app").classList.remove("drawer-open");
  $("message").value = text;
  send();
}

function renderEmpty() {
  $("thread").replaceChildren(el("div", { class: "empty start" },
    el("div", { class: "logo", "aria-hidden": "true", text: "₾" }),
    el("h3", { text: t("empty.title") }),
    el("p", { text: t("empty.desc") }),
    el("div", { class: "empty-grid" }, lookup("suggestions").map((s) =>
      el("button", { class: "empty-card", type: "button", onclick: () => ask(s.text) },
        el("strong", { text: s.tag }), el("span", { text: s.text }))))));
}

function renderWelcome() {
  const first = user ? user.full_name.split(" ")[0] : "";
  $("thread").replaceChildren(el("div", { class: "empty welcome" },
    el("div", { class: "logo", "aria-hidden": "true", text: "₾" }),
    el("h3", { text: first ? t("welcome.title", { name: first }) : t("welcome.titleNoName") }),
    el("p", { text: t("welcome.desc") }),
    el("button", { class: "btn primary", type: "button", text: t("welcome.add"), onclick: openCompanyDialog })));
}

function clearEmpty() {
  const empty = $("thread").querySelector(".empty");
  if (empty) empty.remove();
}

/* ---------- messages ---------- */
function addUser(text) {
  clearEmpty();
  $("thread").append(el("div", { class: "row user" }, el("div", { class: "bubble-user", text })));
  scrollDown();
}

function addBot(...content) {
  clearEmpty();
  const row = el("div", { class: "row bot" }, el("div", { class: "avatar", "aria-hidden": "true", text: "₾" }),
    el("div", { class: "bot-body" }, content));
  $("thread").append(row);
  scrollDown();
  return row;
}

const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const cleanTitle = (s) => capitalize(s.replace(/^(DEMO|დემო):\s*/, ""));
// Matsne titles are often ALL CAPS ("TAX CODE OF GEORGIA").
const titleCase = (s) => s === s.toUpperCase() ? s.toLowerCase().replace(/(^|\s)(\S)/g, (m, sp, ch) => sp + ch.toUpperCase()).replace(/ Of /g, " of ") : s;

// The reply carries the explanation; the card is the receipt: outcome, amount, source, workings.
// Cards follow the reply's language, so a saved conversation keeps reading consistently.
function resultCard(r, l) {
  const tt = (key) => t(key, {}, l);
  const card = el("div", { class: `card ${r.status}` },
    el("div", { class: "card-head" },
      el("span", { class: "card-title", text: cleanTitle(loc(r.title, l)) }),
      el("span", { class: `badge ${r.status}`, text: tt(`card.${r.status}`) }),
      el("span", { class: `badge ${r.verification}`, text: tt(`card.${r.verification}`), title: tt(`card.${r.verification}Tip`) })));

  if (r.amount !== null && r.amount !== undefined) {
    if (r.amount_label) card.append(el("div", { class: "amount-label", text: loc(r.amount_label, l) }));
    card.append(el("div", { class: "amount" }, formatAmount(r.amount, l), el("small", { text: tt("card.currency") })));
  }
  // Steps that didn't apply (e.g. pension for someone outside the scheme) are 0; leave them out.
  const lines = (r.breakdown || []).filter((line) => Number(line.amount) !== 0);
  if (lines.length) {
    card.append(el("table", { class: "breakdown" }, el("tbody", {}, lines.map((line) =>
      el("tr", {}, el("td", { text: loc(line.label, l) }),
        el("td", { text: `${formatAmount(line.amount, l)} ${tt("card.currency")}` }))))));
  }
  card.append(el("div", { class: "source", text: `${tt("card.source")}: ${loc(r.legal_source.citation, l)}` }));

  for (const c of r.citations || []) {
    const pub = /^\d+$/.test(c.publication) ? ` · ${tt("card.publication")} ${c.publication}` : "";
    card.append(el("details", {},
      el("summary", { text: tt("card.excerpt") + (c.language !== l ? tt("card.otherLanguage") : "") }),
      el("blockquote", { text: c.excerpt, lang: c.language }),
      el("a", { class: "cite-link", href: c.url, target: "_blank", rel: "noopener",
        text: `${titleCase(c.title)}${pub} · ${tt("card.openMatsne")}` })));
  }
  if (r.trace && r.trace.length) {
    card.append(el("details", {},
      el("summary", { text: tt("card.how") }),
      el("ol", { class: "trace", lang: "en" }, r.trace.map((step) => el("li", { text: step }))),
      el("div", { class: "source" }, `${tt("card.rule")}: `, el("code", { text: `${r.rule_id} v${r.version}` }))));
  }
  return card;
}

function renderResponse(body, live = true) {
  const l = LANGS.includes(body.extraction.language) ? body.extraction.language : lang;
  const tt = (key) => t(key, {}, l);
  if (live && body.extraction.intent === "list_deadlines") loadDeadlines();
  const parts = [];

  // The reply is the answer. Example questions become chips, so drop their plain-text copies.
  const chips = body.suggestions || [];
  const listed = new Set(chips.map((c) => "- " + c));
  const text = body.reply.split("\n").filter((line) => !listed.has(line.trim())).join("\n").trim();
  parts.push(el("div", { class: "reply", text, lang: l }));

  parts.push(...body.results.map((r) => resultCard(r, l)));
  if (chips.length) {
    parts.push(el("div", { class: "chips" }, chips.map((c) =>
      el("button", { class: "chip", type: "button", text: c, onclick: () => ask(c) }))));
  }
  for (const w of body.warnings || []) parts.push(el("div", { class: "callout warning", text: w }));

  const debug = el("pre", { class: "debug", hidden: true,
    text: JSON.stringify({ extraction: body.extraction, results: body.results }, null, 2) });
  parts.push(el("div", { class: "meta" },
    body.used_context ? el("span", { class: "context-note", text: tt("meta.continued") }) : null,
    el("span", { text: `${tt("meta.reply")}: ${tt("source." + body.reply_source)}` }),
    el("span", { text: `${tt("meta.understood")}: ${tt("source." + body.extraction.source)}` }),
    el("button", { class: "debug-toggle", type: "button", text: tt("meta.rawJson"),
      onclick: () => { debug.hidden = !debug.hidden; } })));
  parts.push(debug);
  addBot(...parts);
}

/* ---------- API ---------- */
class AuthError extends Error {}

function serverText(message) {
  const key = "server." + message;
  return key in (I18N[lang] || {}) ? t(key) : message;
}

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(path, {
    method,
    headers: body === undefined ? {} : { "content-type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401 && !path.startsWith("/auth/")) {
    showAuth();
    throw new AuthError(t("error.signInAgain"));
  }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(errorText(data.detail) || t("error.requestFailed", { status: res.status }));
  return data;
}

function errorText(detail) {
  if (!detail) return "";
  if (typeof detail === "string") return serverText(detail);
  // FastAPI validation errors: [{loc: [..., "field"], msg}]
  return detail.map((d) => {
    const msg = d.msg.replace(/^Value error, /, "");
    const translated = serverText(msg);
    return translated !== msg ? translated : `${d.loc[d.loc.length - 1]}: ${msg}`;
  }).join("; ");
}

/* ---------- state ---------- */
let user = null;
let conversationId = null;

function currentCompany() { return companies.find((c) => c.id === $("company").value); }

/* ---------- sending ---------- */
const input = $("message");
function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
  $("send").disabled = busy || !input.value.trim() || !companies.length;
}
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });

async function send() {
  const message = input.value.trim();
  if (!message || busy || !companies.length) return;
  busy = true;
  input.value = "";
  autosize();
  addUser(message);
  const typing = addBot(el("div", { class: "typing", "aria-label": t("composer.thinking") }, el("span"), el("span"), el("span")));
  try {
    const body = await api(`/companies/${$("company").value}/chat`, {
      method: "POST",
      body: { message, as_of: $("asOf").value, conversation_id: conversationId || undefined, language: lang },
    });
    typing.remove();
    const isNew = conversationId !== body.conversation_id;
    conversationId = body.conversation_id;
    renderResponse(body);
    if (isNew) loadHistory(); else touchHistory();
  } catch (err) {
    typing.remove();
    if (!(err instanceof AuthError)) addBot(el("div", { class: "callout error", text: t("error.generic", { message: err.message }) }));
  } finally {
    busy = false;
    autosize();
    input.focus();
  }
}

/* ---------- conversations ---------- */
function relativeTime(iso) {
  // SQLite (tests) returns naive UTC timestamps; Postgres returns an offset.
  const then = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "Z");
  const minutes = Math.round((Date.now() - then) / 60000);
  if (minutes < 1) return t("history.justNow");
  if (minutes < 60) return tp("time.minutesAgo", minutes);
  const hours = Math.round(minutes / 60);
  if (hours < 24) return tp("time.hoursAgo", hours);
  const days = Math.round(hours / 24);
  if (days < 7) return tp("time.daysAgo", days);
  return fullDate(then);
}

let historyItems = [];

function svgIcon(d) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  const attrs = { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" };
  for (const [k, v] of Object.entries(attrs)) svg.setAttribute(k, v);
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", d);
  svg.append(path);
  return svg;
}

function renderHistory() {
  const box = $("history");
  if (!historyItems.length) {
    box.replaceChildren(el("div", { class: "history-empty", text: t("history.empty") }));
    return;
  }
  box.replaceChildren(...historyItems.map((c) =>
    el("div", { class: "history-item" + (c.id === conversationId ? " active" : ""), role: "button", tabindex: "0",
        onclick: () => openConversation(c.id),
        onkeydown: (e) => { if (e.key === "Enter") openConversation(c.id); } },
      el("div", { class: "h-text" },
        el("div", { class: "h-title", text: c.title }),
        el("div", { class: "h-time", text: relativeTime(c.updated_at) })),
      el("button", { class: "h-del", type: "button", title: t("history.delete"), "aria-label": t("history.deleteAria", { title: c.title }),
          onclick: (e) => { e.stopPropagation(); deleteConversation(c); } },
        svgIcon("M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14")))));
}

async function loadHistory() {
  const company = currentCompany();
  if (!company) { historyItems = []; renderHistory(); return; }
  try {
    historyItems = await api(`/conversations?company_id=${company.id}`);
  } catch { historyItems = []; }
  renderHistory();
}

function touchHistory() {
  const item = historyItems.find((c) => c.id === conversationId);
  if (item) {
    item.updated_at = new Date().toISOString();
    historyItems = [item, ...historyItems.filter((c) => c !== item)];
  }
  renderHistory();
}

async function openConversation(id) {
  $("app").classList.remove("drawer-open");
  if (busy) return;
  try {
    const conv = await api(`/conversations/${id}`);
    conversationId = conv.id;
    $("thread").replaceChildren();
    for (const m of conv.messages) {
      if (m.role === "user") addUser(m.content);
      else if (m.payload) renderResponse(m.payload, false);
      else addBot(el("div", { class: "reply", text: m.content }));
    }
    // Re-open with the date the conversation was evaluated at, so follow-ups use the same rule versions.
    const last = [...conv.messages].reverse().find((m) => m.payload && m.payload.as_of);
    if (last) $("asOf").value = last.payload.as_of;
    // Saved messages appear at once; the arrival animation is only for new ones.
    for (const row of $("thread").querySelectorAll(".row")) row.classList.add("restored");
    renderHistory();
    scrollDown();
  } catch (err) {
    if (!(err instanceof AuthError)) addBot(el("div", { class: "callout error", text: t("error.openConversation", { message: err.message }) }));
  }
}

async function deleteConversation(c) {
  if (!confirm(t("history.confirmDelete", { title: c.title }))) return;
  try {
    await api(`/conversations/${c.id}`, { method: "DELETE" });
    if (c.id === conversationId) newChat();
    historyItems = historyItems.filter((x) => x.id !== c.id);
    renderHistory();
  } catch (err) {
    if (!(err instanceof AuthError)) alert(t("error.delete", { message: err.message }));
  }
}

function newChat() {
  conversationId = null;
  $("asOf").value = new Date().toISOString().slice(0, 10);
  renderEmpty();
  renderHistory();
  $("app").classList.remove("drawer-open");
  input.focus();
}
$("newChatBtn").addEventListener("click", newChat);

let currentProfile = null;
let profileState = "none";  // none | loaded | unset

async function loadProfile(company) {
  currentProfile = null;
  profileState = "none";
  $("title").textContent = company.name;
  try {
    currentProfile = await api(`/companies/${company.id}/tax-profile`);
    profileState = "loaded";

    if (err instanceof AuthError) return;
    profileState = "unset";

  renderProfile();

function renderProfile() {
  const company = currentCompany();
  const box = $("profile");
  if (!company || profileState === "none") { box.hidden = true; return; }
  const yes = (b) => t(b ? "common.yes" : "common.no");
  const rows = [[t("profile.taxId"), company.tax_id], [t("profile.legalForm"), t("legal." + company.legal_form)]];
  const p = currentProfile;
  if (p) {
    rows.push([t("profile.vat"), yes(p.vat_registered)], [t("profile.employees"), yes(p.has_employees)],
      [t("profile.property"), yes(p.owns_property)], [t("profile.regime"), t("regime." + p.tax_regime)]);
  } else {
    rows.push([t("profile.taxProfile"), t("profile.notSet")]);
  }
  box.replaceChildren(
    ...rows.map(([k, v]) => el("div", { class: "profile-row" }, el("span", { text: k }), el("span", { text: v }))),
    el("div", { class: "profile-actions" },
      el("button", { class: "btn small", type: "button", text: t("common.edit"), onclick: openProfileDialog })));
  box.hidden = false;
}

/* ---------- deadlines ---------- */
let deadlineItems = [];
let showAllDeadlines = false;
const SIDEBAR_LIMIT = 6;

function renderDeadlines() {
  const box = $("deadlines");
  $("deadlinesSection").hidden = !currentCompany();
  if (!deadlineItems.length) {
    box.replaceChildren(el("div", { class: "deadlines-empty", text: t("deadlines.none") }));
    return;
  }
  // Open items first (overdue, then soonest); done ones stay visible at the end until they age out.
  const sorted = [...deadlineItems].sort((a, b) => (a.state === "done") - (b.state === "done") || a.days_left - b.days_left);
  const shown = showAllDeadlines ? sorted : sorted.slice(0, SIDEBAR_LIMIT);
  box.replaceChildren(...shown.map((d) => {
    const when = d.state === "done" ? "" : d.days_left < 0 ? tp("deadlines.overdue", -d.days_left)
      : d.days_left === 0 ? t("deadlines.today") : d.days_left === 1 ? t("deadlines.tomorrow") : tp("deadlines.inDays", d.days_left);
    const monthly = d.period_start.slice(0, 7) === d.period_end.slice(0, 7);
    const period = monthly ? monthYear(d.period_start) : d.period_start.slice(0, 4);
    const check = el("input", { type: "checkbox", "aria-label": t("deadlines.markDone"), title: t("deadlines.markDone") });
    check.checked = d.state === "done";
    check.addEventListener("change", () => markDeadline(d, check.checked));
    return el("div", { class: `deadline ${d.state}`, title: loc(d.description) || "" }, check,
      el("div", { class: "d-text" },
        el("div", { class: "d-title", text: `${loc(d.title)} · ${period}` }),
        el("div", { class: "d-when", text: t("deadlines.by", { date: shortDate(d.due_date) }) + (when ? " · " + when : "") })));
  }));
  if (sorted.length > SIDEBAR_LIMIT) {
    box.append(el("button", { class: "btn small", type: "button",
      text: showAllDeadlines ? t("deadlines.showLess") : t("deadlines.showAll", { n: sorted.length }),
      onclick: () => { showAllDeadlines = !showAllDeadlines; renderDeadlines(); } }));
  }
}

async function loadDeadlines() {
  const company = currentCompany();
  if (!company) { deadlineItems = []; renderDeadlines(); return; }
  try {
    deadlineItems = await api(`/companies/${company.id}/deadlines?as_of=${$("asOf").value}`);
  } catch { deadlineItems = []; }
  renderDeadlines();
}

async function markDeadline(d, done) {
  try {
    await api(`/companies/${currentCompany().id}/deadlines/${d.deadline_id}/${d.period_start}?as_of=${$("asOf").value}`,
      { method: "PUT", body: { done } });
  } catch (err) {
    if (!(err instanceof AuthError)) alert(err.message);
  }
  loadDeadlines();
}

async function loadCompanies(selectId) {
  try {
    companies = await api("/companies");
  } catch { companies = []; }
  const select = $("company");
  select.replaceChildren(...companies.map((c) => new Option(c.name, c.id)));

  if (!companies.length) {
    $("title").textContent = t("noCompany.title");
    $("profile").hidden = true;
    deadlineItems = [];
    renderDeadlines();

    renderWelcome();

async function loadStatus() {

    statusData = await api("/chat/status");
  } catch {
    statusData = { failed: true };
  }

function renderStatus() {
  const pill = $("aiPill");
  const s = statusData;
  if (!s) return;
  if (s.failed) {
    pill.replaceChildren(el("span", { class: "dot" }), el("span", { text: t("status.unknown") }));
    return;
  }
  pill.classList.toggle("ai", s.ai_enabled);
  const label = { claude: t("status.claude"), ollama: t("status.local") }[s.provider] || t("status.offline");
  pill.title = !s.ai_enabled ? t("status.tipOffline")
    : t("status.tipAi", { model: s.model, replies: t("source." + s.replies) }) + (s.provider === "ollama" ? ". " + t("status.tipLocal") : "");
  pill.replaceChildren(el("span", { class: "dot" }),
    el("span", {}, label, el("span", { class: "label-long", text: s.ai_enabled ? ` · ${s.model}` : ` · ${t("status.keywords")}` })));
  $("indexStatus").replaceChildren(el("span", { class: s.legal_index ? "dot on" : "dot" }),
    t(s.legal_index ? "index.connected" : "index.offline"));
}

/* ---------- sign in / register ---------- */
let authMode = "login";
const authForm = $("authForm");

function setAuthMode(mode) {
  authMode = mode;
  $("tabLogin").setAttribute("aria-selected", mode === "login");
  $("tabRegister").setAttribute("aria-selected", mode === "register");
  $("nameField").hidden = mode === "login";
  $("passwordHint").hidden = mode === "login";
  authForm.elements.password.autocomplete = mode === "login" ? "current-password" : "new-password";
  $("authSubmit").textContent = t(mode === "login" ? "auth.signIn" : "auth.register");
  $("authError").textContent = "";
}
$("tabLogin").addEventListener("click", () => setAuthMode("login"));
$("tabRegister").addEventListener("click", () => setAuthMode("register"));

function showAuth() {
  user = null;
  conversationId = null;
  $("auth").hidden = false;
  authForm.elements.password.value = "";
  authForm.elements.email.focus();
}

authForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = authForm.elements;
  const body = { email: f.email.value.trim(), password: f.password.value };
  if (authMode === "register") {
    body.full_name = f.full_name.value.trim();
    body.language = lang;
    if (!body.full_name) { $("authError").textContent = t("auth.errName"); return; }
    if (body.password.length < 8) { $("authError").textContent = t("auth.errPassword"); return; }
  }
  $("authSubmit").disabled = true;
  try {
    const me = await api(`/auth/${authMode}`, { method: "POST", body });
    f.password.value = "";
    await startApp(me);
  } catch (err) {
    $("authError").textContent = err.message;
  } finally {
    $("authSubmit").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try { await api("/auth/logout", { method: "POST" }); } catch { /* signing out locally regardless */ }
  companies = [];
  historyItems = [];
  $("thread").replaceChildren();
  showAuth();
});

/* ---------- boot ---------- */
async function startApp(me) {
  user = me;
  $("auth").hidden = true;
  // The account's language wins over this browser's; a first sign-in adopts the browser's choice.
  if (me.language && me.language !== lang) await setLanguage(me.language, { save: false });
  else if (!me.language) api("/auth/me", { method: "PATCH", body: { language: lang } }).catch(() => {});
  $("userName").textContent = me.full_name;
  $("userEmail").textContent = me.email;
  $("initials").textContent = me.full_name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  conversationId = null;
  $("asOf").value = new Date().toISOString().slice(0, 10);
  renderEmpty();
  loadStatus();
  await loadCompanies();
  loadHistory();
}

(async function boot() {
  try {
    I18N = await (await fetch("/static/i18n.json")).json();
  } catch {
    I18N = {};
  }
  lang = initialLanguage();
  applyStatic();
  setAuthMode("login");
  $("title").textContent = t("chat.title");
  try {
    const me = await api("/auth/me");
    await startApp(me);
  } catch {
    showAuth();
  }
})();
</script>
</body>
</html>
