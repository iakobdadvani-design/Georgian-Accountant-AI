<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Georgian AI Accountant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%238c1d33'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'>₾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f2f2ef; --ink: #111418; --muted: #5b6270; --faint: #7c828d;
    --border: #e8e6e1; --border-strong: #d9d7d0; --accent: #8c1d33; --accent-ink: #ffffff; --accent-soft: #fbeff1;
    --ok: #1e7a4c; --ok-soft: #e8f5ee; --warn: #a15c00; --warn-soft: #fff4e0; --info: #2b5c95; --info-soft: #eaf1fa;
    --demo: #6d28d9; --demo-soft: #efe9fb;
    --c-wine: #8c1d33; --c-violet: #6d28d9; --c-teal: #0f766e; --c-amber: #b45309; --c-blue: #1d4ed8; --c-indigo: #4338ca; --c-green: #15803d; --c-slate: #475569; --hero: #15202f;
    --shadow: 0 1px 2px rgb(17 20 24 / .04);
    --shadow-lg: 0 12px 32px rgb(17 20 24 / .12), 0 2px 6px rgb(17 20 24 / .06);
    --radius: 18px;
    --font: "IBM Plex Sans", "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  /* Light unless the user picks dark in the account menu (it no longer follows the system setting). */
  :root[data-theme="dark"] {
    --bg: #111317; --surface: #181b20; --surface-2: #1f2329; --ink: #eef0f3; --muted: #a3a9b4; --faint: #858c98;
    --border: #2a2f37; --border-strong: #3a404a; --accent: #e5738a; --accent-ink: #16181c; --accent-soft: #3a1e27;
    --ok: #4ade80; --ok-soft: #16301f; --warn: #fbbf24; --warn-soft: #3a2c12; --info: #8fb8ea; --info-soft: #1b2a3d;
    --demo: #b79cf5; --demo-soft: #2a2140;
    --c-wine: #f07a92; --c-violet: #a78bfa; --c-teal: #2dd4bf; --c-amber: #fbbf24; --c-blue: #60a5fa; --c-indigo: #818cf8; --c-green: #4ade80; --c-slate: #94a3b8; --hero: #1d2a3e;
    --shadow: 0 1px 2px rgb(0 0 0 / .3); --shadow-lg: 0 12px 32px rgb(0 0 0 / .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { display: grid; grid-template-columns: 268px minmax(0, 1fr); grid-template-rows: 100%; height: 100vh; height: 100dvh;
    overflow: hidden; }

  /* ---------- sidebar ---------- */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px 16px; display: flex;
    flex-direction: column; gap: 4px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-size: 19px; font-weight: 700; flex: none; }
  .brand h1 { font-size: 15px; line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .brand p { display: none; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 11px; min-height: 46px; padding: 6px 10px; border-radius: 13px;
    color: var(--ink); text-decoration: none; font-size: 14.5px; font-weight: 500; line-height: 1.3; opacity: .92;
    transition: background .12s; }
  [data-view="overview"] { --c: var(--c-wine); }
  [data-view="assistant"] { --c: var(--c-violet); }
  [data-view="books"] { --c: var(--c-teal); }
  [data-view="calendar"] { --c: var(--c-amber); }
  [data-view="payments"] { --c: var(--c-blue); }
  [data-view="companies"] { --c: var(--c-indigo); }
  [data-view="banks"] { --c: var(--c-green); }
  [data-view="reviews"] { --c: var(--c-slate); }
  .nav-ico { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center;
    color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
  .nav-item:hover { background: var(--surface-2); opacity: 1; }
  .nav-item[aria-current="page"] { background: color-mix(in srgb, var(--c) 10%, var(--surface)); color: var(--c); font-weight: 600; opacity: 1; }
  .nav-item[aria-current="page"] .nav-ico { background: var(--c); color: var(--surface); }
  .nav-item .nav-text { flex: 1; min-width: 0; }
  .nav-badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .nav-label { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    margin: 18px 12px 6px; }
  .side-foot { margin-top: auto; padding-top: 12px; display: grid; gap: 8px; }
  @media (max-height: 860px) { .help-card { display: none; } .nav-label { margin-top: 12px; } }
  @media (max-height: 700px) { .nav-item { min-height: 40px; padding-top: 4px; padding-bottom: 4px; } .nav-ico { width: 28px; height: 28px; } }
  .help-card { display: grid; gap: 6px; padding: 14px; border-radius: 14px; text-align: left; color: var(--ink);
    background: color-mix(in srgb, var(--c-violet) 10%, var(--surface));
    border: none; cursor: pointer; }
  .help-card strong { font-size: 13px; color: var(--c-violet); }
  .help-card span { font-size: 12.5px; line-height: 1.45; color: var(--muted); }
  .nav-item.subtle { font-size: 13.5px; color: var(--muted); min-height: 40px; }
  .nav-item.subtle .nav-ico { width: 28px; height: 28px; }
  .section-label { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px; }
  .field { width: 100%; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
  .icon-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 44px; height: 44px;
    display: grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
  .icon-btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--faint); margin-right: 6px; }
  .dot.on { background: var(--ok); }

  /* ---------- top bar ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
  .topbar { display: flex; align-items: center; gap: 10px; height: 68px; flex: none; padding: 0 24px;
    border-bottom: 1px solid var(--border); background: var(--surface); }
  .menu-btn { display: none; }
  .company-switch { position: relative; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface); max-width: 320px; min-width: 0; }
  .company-switch:focus-within { border-color: var(--accent); }
  .company-badge { width: 28px; height: 28px; border-radius: 8px; background: var(--c-indigo); color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .company-select { appearance: none; border: none; background: transparent; outline: none; font-weight: 600; font-size: 14px;
    padding-right: 20px; min-width: 0; max-width: 250px; text-overflow: ellipsis; cursor: pointer; }
  .company-switch::after { content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px;
    border-right: 1.8px solid var(--muted); border-bottom: 1.8px solid var(--muted); transform: translateY(-70%) rotate(45deg);
    pointer-events: none; }
  .askbar { flex: 1; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; height: 44px;
    padding: 0 10px 0 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid transparent; }
  .askbar:focus-within { border-color: var(--accent); background: var(--surface); }
  .askbar svg { color: var(--muted); flex: none; }
  .askbar input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 14.5px; }
  .askbar kbd { font: 500 11.5px var(--font); color: var(--muted); border: 1px solid var(--border-strong); border-radius: 6px;
    padding: 1px 6px; background: var(--surface); }
  .account-menu { position: relative; flex: none; }
  .avatar-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--c-indigo); color: #fff;
    font-weight: 700; font-size: 14px; cursor: pointer; }
  .menu-list { position: absolute; right: 0; top: calc(100% + 8px); z-index: 60; min-width: 250px; padding: 6px; display: grid; gap: 2px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); }
  .menu-who { display: grid; gap: 1px; padding: 10px 12px 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .menu-who strong { font-size: 14px; }
  .menu-who span { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 8px 12px; border: none;
    border-radius: 10px; background: none; color: var(--ink); text-align: left; text-decoration: none; cursor: pointer; font-size: 14px; }
  .menu-item:hover, .menu-item:focus-visible { background: var(--surface-2); outline: none; }
  .menu-date { display: grid; gap: 4px; padding: 8px 12px; font-size: 12.5px; color: var(--muted); }
  .menu-sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* ---------- views ---------- */
  .views { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow-y: auto; }
  .page { max-width: 1160px; margin: 0 auto; padding: 28px 32px 40px; display: grid; gap: 20px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  #overview { --c: var(--c-wine); } #calendar { --c: var(--c-amber); } #companies { --c: var(--c-indigo); } #banks { --c: var(--c-green); }
  #payments { --c: var(--c-blue); } #books { --c: var(--c-teal); } #reviews { --c: var(--c-slate); }
  .page-head h1::after { content: ""; display: block; width: 44px; height: 4px; border-radius: 2px; margin-top: 10px; background: var(--c, var(--accent)); }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 15px; max-width: 720px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px;
    display: grid; gap: 14px; align-content: start; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
  .panel h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .link-btn { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer;
    text-decoration: none; }
  .link-btn:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .state { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px;
    font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
  .state.bad { background: var(--accent-soft); color: var(--accent); }
  .state.todo { background: var(--warn-soft); color: var(--warn); }
  .state.good { background: var(--ok-soft); color: var(--ok); }
  .state.info { background: var(--info-soft); color: var(--info); }
  .state .state-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* overview */
  .ov-grid { display: grid; grid-template-columns: minmax(0, 1fr) 356px; gap: 20px; align-items: start; }
  .ov-main, .ov-side { display: grid; gap: 20px; min-width: 0; }
  .hero { padding: 26px 28px; gap: 18px; background: var(--hero); border-color: var(--hero); color: #fff; }
  .hero .muted, .hero h2.muted { color: rgb(255 255 255 / .72); }
  .hero .hero-sub { color: rgb(255 255 255 / .72); }
  .hero .hero-amount.none { color: rgb(255 255 255 / .85); }
  .hero .btn { background: transparent; color: #fff; border-color: rgb(255 255 255 / .35); }
  .hero .btn:hover { background: rgb(255 255 255 / .08); }
  .hero .btn.primary { background: #fff; color: var(--hero); border-color: #fff; }
  .hero .state.bad { background: #f3c1cb; color: #6e1527; }
  .hero .state.todo { background: #ffe2b0; color: #6b3d00; }
  .hero.welcome { background: var(--surface); border-color: var(--border); color: var(--ink); }
  .hero.welcome .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .hero-body { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .hero-amount { font-size: 44px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .hero-amount.none { font-size: 22px; letter-spacing: -.01em; color: var(--muted); font-weight: 600; }
  .hero-title { font-size: 16px; font-weight: 600; margin-top: 8px; }
  .hero-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .hero-penalty { font-size: 13.5px; font-weight: 600; margin-top: 6px; color: #ffb4c2; }
  .dl-penalty { font-size: 12.5px; font-weight: 600; color: var(--accent); }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .stat { --c: var(--c-slate); background: color-mix(in srgb, var(--c) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 22%, var(--border));
    border-radius: 18px; padding: 18px 20px; display: grid; gap: 6px; }
  .stat.green { --c: var(--c-green); } .stat.amber { --c: var(--c-amber); } .stat.wine { --c: var(--c-wine); } .stat.blue { --c: var(--c-blue); }
  .stat-top { display: flex; align-items: center; gap: 10px; }
  .stat-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--c); color: #fff; flex: none; }
  .stat-label { font-size: 13.5px; color: var(--muted); }
  .stat-value { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat-hint { font-size: 12.5px; color: var(--muted); }
  .stat-hint.up { color: var(--ok); font-weight: 600; }
  .dl-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 12px 0;
    border-top: 1px solid var(--border); }
  .dl-row:first-of-type { border-top: 0; }
  .date-badge { --c: var(--c-slate); display: grid; justify-items: center; padding: 5px 0; border-radius: 12px; line-height: 1.15;
    background: color-mix(in srgb, var(--c) 13%, var(--surface)); color: var(--c); }
  .date-badge.vat { --c: var(--c-wine); } .date-badge.payroll { --c: var(--c-teal); } .date-badge.profit { --c: var(--c-blue); }
  .date-badge.property { --c: var(--c-amber); } .date-badge.income { --c: var(--c-green); }
  .date-badge b { font-size: 18px; }
  .date-badge span { font-size: 11.5px; font-weight: 600; }
  .date-badge.overdue { box-shadow: inset 0 0 0 2px var(--accent); }
  .dl-text { display: grid; gap: 2px; min-width: 0; }
  .dl-title { font-size: 15px; font-weight: 600; }
  .dl-when { font-size: 13px; color: var(--muted); }
  .dl-row.overdue .dl-when { color: var(--accent); font-weight: 500; }
  .dl-row.due_soon .dl-when { color: var(--warn); font-weight: 500; }
  .dl-amount { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .dl-amount.none { font-size: 13px; font-weight: 400; color: var(--muted); }
  .progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .progress span { display: block; height: 100%; border-radius: inherit; background: var(--ok); }
  .steps { display: grid; gap: 4px; }
  .step { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: none; background: none;
    text-align: left; color: var(--ink); width: 100%; }
  button.step { cursor: pointer; }
  button.step:hover { background: var(--surface-2); }
  .step.next { background: var(--warn-soft); }
  .step-mark { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid var(--border-strong); display: grid;
    place-items: center; color: #fff; }
  .step.done .step-mark { background: var(--ok); border-color: var(--ok); }
  .step.next .step-mark { border-color: var(--warn); }
  .step-text { flex: 1; display: grid; gap: 2px; }
  .step-text b { font-size: 14.5px; font-weight: 600; }
  .step.done .step-text b { font-weight: 500; color: var(--muted); text-decoration: line-through; }
  .step-text span { font-size: 12.5px; color: var(--muted); }
  .quick { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--surface); cursor: pointer; text-align: left; font-weight: 500; }
  .quick:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .quick-ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--c) 13%, var(--surface)); color: var(--c); }

  /* calendar */
  .cal-month h3 { margin: 6px 0 2px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .cal-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto auto; gap: 16px; align-items: center; padding: 12px 0;
    border-top: 1px solid var(--border); }
  .cal-row.done .dl-title { color: var(--muted); text-decoration: line-through; }
  .cal-check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .cal-check input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* companies & banks */
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start; }
  .entity { display: grid; gap: 16px; }
  .entity.todo { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
  .entity-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .entity-mark { --c: var(--c-indigo); width: 44px; height: 44px; flex: none; border-radius: 12px; color: var(--c);
    background: color-mix(in srgb, var(--c) 14%, var(--surface));
    display: grid; place-items: center; font-size: 14px; font-weight: 700; }
  .entity-name { flex: 1; min-width: 160px; display: grid; gap: 2px; }
  .entity-name b { font-size: 17px; font-weight: 650; }
  .entity-name span { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .fact { display: grid; gap: 4px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); }
  .fact span { font-size: 12.5px; color: var(--muted); }
  .fact b { font-size: 14.5px; font-weight: 600; }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .actions .grow { flex: 1; font-size: 13px; color: var(--muted); }
  .notice { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; font-size: 13.5px;
    background: var(--surface-2); }
  .notice.todo { background: var(--warn-soft); }
  .notice.good { background: var(--ok-soft); }
  .notice > span { flex: 1; min-width: 180px; }
  .steps-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .steps-list li { display: flex; gap: 12px; font-size: 14px; line-height: 1.45; }
  .steps-list .n { width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 12.5px; font-weight: 700; }
  .stack { display: grid; gap: 14px; }

    .books-table .who { max-width: 120px; }
    .books-card-value { font-size: 17px; }
  }

  /* ---------- rule review ---------- */
  .review-heading { margin: 0 0 4px; font-size: 18px; letter-spacing: -.01em; }
  .review-list { display: grid; gap: 10px; }
  .review-item { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--faint);
    border-radius: 12px; box-shadow: var(--shadow); }
  .review-item.verified { border-left-color: var(--ok); }
  .review-item.changes_requested, .review-item.outdated { border-left-color: var(--warn); }
  .review-item > summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; }
  .review-item > summary::-webkit-details-marker { display: none; }
  .review-item > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.6px solid var(--muted);
    border-bottom: 1.6px solid var(--muted); transform: rotate(45deg); margin-left: 4px; transition: transform .2s; }
  .review-item[open] > summary::after { transform: rotate(225deg); }
  .review-kind { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); flex: none; }
  .review-title { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; }

  .review-status.changes_requested, .review-status.outdated { background: var(--warn-soft); color: var(--warn); }
  .review-body { padding: 0 16px 16px; display: grid; gap: 12px; font-size: 13.5px; }
  .review-body h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
  .review-body p { margin: 0; }
  .review-meta a { color: var(--accent); font-weight: 500; }
  .cond-list, .step-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .cond-group { list-style: none; margin-left: -20px; color: var(--muted); }
  .cond-why { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .review-body code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 1px 6px; }
  .raw summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .raw pre { font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; overflow: auto; max-height: 320px; margin: 8px 0 0; }
  .review-history ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .review-form { display: grid; gap: 10px; border-top: 1px solid var(--border); padding-top: 12px; }
  .review-form label { display: grid; gap: 5px; font-size: 13px; font-weight: 500; }
  .review-form textarea { resize: vertical; font: inherit; }

  /* ---------- account ---------- */
  .who-btn { background: none; border: none; padding: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; min-width: 0; }
  .who-btn:hover #userName { color: var(--accent); }
  .danger-zone { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border)); border-radius: 12px; padding: 12px;
    display: grid; gap: 8px; background: var(--accent-soft); }
  .danger-zone p { margin: 0; font-size: 13px; color: var(--muted); }
  .btn.danger { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ---------- reminders ---------- */
  .rem-telegram { border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: grid; gap: 8px; background: var(--surface-2); }
  .rem-telegram-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
  .dialog-actions.start { justify-content: flex-start; margin: 0; }
  .pay-dialog { width: min(540px, calc(100vw - 32px)); }
  .pay-dialog .form-grid { gap: 14px; }
  .pay-due { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .pay-due.overdue { color: var(--accent); font-weight: 500; }
  .pay-step { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; }
  .step-no { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 650;
    background: var(--accent-soft); color: var(--accent); }

  .step-title { font-size: 14px; font-weight: 600; line-height: 26px; }
  .pay-details { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface-2); }
  .pay-details .return-line { font-size: 13px; }
  .pay-details .return-line strong { overflow-wrap: anywhere; text-align: right; }
  #payDialog .hint-text, .payments .hint-text { margin: 0; font-size: 12.5px; color: var(--faint); line-height: 1.45; }
  .bank-open { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; justify-self: start; padding-left: 8px; }
  .bank-open::after { content: "↗"; color: var(--faint); }

  /* ---------- tax payments ---------- */
  .pay-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px;
    display: grid; gap: 12px; }
  .pay-card h3 { margin: 0; font-size: 16px; font-weight: 650; }
  .pay-banks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .bank-tile { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--border);
    border-left: 4px solid var(--bank, var(--border)); border-radius: 10px; color: var(--ink); font: inherit;
    font-size: 13.5px; font-weight: 500; background: var(--surface); cursor: pointer; text-align: left; }
  .bank-tile:hover, .bank-tile:focus-visible { border-color: var(--bank); outline: none; }
  .bank-tile[aria-pressed="true"] { border-color: var(--bank); background: color-mix(in srgb, var(--bank) 10%, var(--surface));
    box-shadow: 0 0 0 1px var(--bank); }
  .bank-linked { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); border-left: 5px solid var(--bank); background: var(--surface-2); }
  .bank-linked .bank-name { font-size: 16px; font-weight: 650; }
  .bank-linked .bank-iban { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .bank-linked .bank-text { flex: 1; min-width: 160px; display: grid; gap: 2px; }
  .bank-linked .books-actions { margin-left: auto; }
  .bank-form { display: grid; gap: 10px; }
  .bank-form label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; max-width: 360px; }
  .pay-list { display: grid; }
  .pay-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 11px 0;
    border-top: 1px solid var(--border); }
  .pay-row:first-child { border-top: 0; padding-top: 2px; }
  .pay-row .r-title { font-size: 14px; font-weight: 500; }
  .pay-row .r-when { font-size: 12.5px; color: var(--muted); }
  .pay-group { display: grid; }
  .pay-group + .pay-group { margin-top: 10px; }
  .pay-group-head { font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 6px 0 2px;
    text-transform: none; letter-spacing: .01em; }
  .pay-group.overdue .pay-group-head { color: var(--accent); }
  .pay-group.due_soon .pay-group-head { color: var(--warn); }
  .pay-group .pay-row:first-of-type { border-top: 0; padding-top: 6px; }
  .pay-row .r-amount { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
  .pay-row .r-amount.none { font-weight: 400; font-size: 12.5px; color: var(--faint); }
  .pay-row.paid { grid-template-columns: 1fr auto; }
  .pay-row.paid .r-amount { color: var(--ok); }
  .pay-empty { font-size: 13px; color: var(--faint); }
  @media (max-width: 560px) {
    .pay-row { grid-template-columns: 1fr auto; }
    .pay-row .btn { grid-column: 1 / -1; justify-self: start; }
    .bank-linked .books-actions { margin-left: 0; }
  }
  #remindersDialog .hint-text { margin: 0; font-size: 12.5px; color: var(--faint); }

  /* ---------- auth screen ---------- */
  .auth { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 20px;
    overflow-y: auto; }
  .auth[hidden] { display: none; }
  .auth-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    box-shadow: var(--shadow); padding: 30px 28px; }
  .auth-card .logo { margin: 0 auto 16px; width: 52px; height: 52px; font-size: 28px; border-radius: 15px; }
  .auth-card h1 { text-align: center; font-size: 21px; margin: 0 0 4px; letter-spacing: -.01em; }
  .auth-card > p { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 11px; padding: 3px; margin-bottom: 18px; }
  .tabs button { border: none; background: none; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .form-grid { display: grid; gap: 12px; }
  .form-grid label { display: grid; gap: 5px; font-size: 13px; font-weight: 500; }
  .form-grid label[hidden] { display: none; }
  .form-grid .check { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 14px; }
  .form-grid .hint-text { font-size: 12px; color: var(--faint); font-weight: 400; }
  .form-error { color: var(--accent); font-size: 13px; min-height: 18px; margin: 0; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rs-lookup { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: -2px; }
  .rs-btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .rs-btn svg { width: 13px; height: 13px; flex: none; }
  .rs-btn:disabled { opacity: .6; cursor: progress; }
  .rs-btn.busy svg { animation: rs-pulse .9s ease-in-out infinite alternate; }
  @keyframes rs-pulse { to { opacity: .25; } }
  .rs-note { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .rs-note:empty { display: none; }
  .rs-note.ok { color: var(--ok); }
  .rs-note.err { color: var(--accent); }

  /* ---------- dialog ---------- */
  dialog { border: 1px solid var(--border); border-radius: 18px; padding: 24px; width: min(460px, calc(100vw - 32px));
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog h3 { margin: 0; font-size: 18px; }
  dialog .form-grid > p { margin: -6px 0 6px; color: var(--muted); font-size: 13.5px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  @media (max-width: 1100px) {
    .ov-grid, .two-col { grid-template-columns: minmax(0, 1fr); }
    .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .askbar kbd { display: none; }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 30; transform: translateX(-100%);
      transition: transform .25s ease; box-shadow: var(--shadow-lg); }
    .app.drawer-open .sidebar { transform: none; }
    .app.drawer-open .scrim { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 25; }
    .menu-btn { display: grid; }
    .topbar { padding: 0 12px; gap: 8px; height: 60px; }
    .askbar, #remindersBtn { display: none; }
    .company-switch { flex: 1; max-width: none; }
    .company-select { max-width: none; width: 100%; }
    .main { padding-bottom: 68px; }
    .page, .books { padding: 18px 16px 28px; }
    .page-head h1 { font-size: 24px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .hero { padding: 20px; }
    .hero-amount { font-size: 36px; }
    .hero-actions, .hero-actions .btn { width: 100%; }
    .state { white-space: normal; }
    .dl-row, .cal-row { grid-template-columns: 48px minmax(0, 1fr) auto; }
    .dl-row .btn, .cal-row .btn, .cal-row .cal-check { grid-column: 2 / -1; justify-self: start; }
    .assistant { grid-template-columns: 1fr; }
    .chats { display: none; }
    #log, .composer-wrap { padding-left: 16px; padding-right: 16px; }
    .empty-grid { grid-template-columns: 1fr; }
    .pill .label-long { display: none; }
    .tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      height: 68px; background: var(--surface); border-top: 1px solid var(--border); }
    .tab { display: grid; justify-items: center; align-content: center; gap: 3px; border: none; background: none; color: var(--muted);
      font-size: 11px; font-weight: 500; text-decoration: none; cursor: pointer; padding: 0 2px; }
    .tab[aria-current="page"] { color: var(--c); font-weight: 600; }
  }
  @media (max-width: 520px) {
    .stats { grid-template-columns: 1fr; }
    .facts { grid-template-columns: 1fr 1fr; }
    .lang-current { display: none; }
  }

  /* ---------- language picker ---------- */
  .lang-menu { position: relative; flex: none; }
  .lang-trigger { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 11px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer;
    font-size: 13px; font-weight: 500; transition: border-color .15s, box-shadow .15s; }
  .lang-trigger:hover { border-color: var(--faint); }
  .lang-trigger:focus-visible, .lang-menu.open .lang-trigger { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .chevron { width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted);
    transform: translateY(-2px) rotate(45deg); transition: transform .2s; margin-left: 2px; }
  .lang-menu.open .chevron { transform: translateY(1px) rotate(225deg); }
  .flag { width: 20px; height: 14px; border-radius: 3px; object-fit: cover; flex: none;
    box-shadow: 0 0 0 1px rgb(0 0 0 / .12); }
  .lang-list { position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; min-width: 220px; padding: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 32px rgb(0 0 0 / .14), 0 2px 6px rgb(0 0 0 / .06);
    display: grid; gap: 2px; opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.98); transform-origin: top right;
    transition: opacity .16s ease, transform .16s ease, visibility 0s linear .16s; }
  .lang-menu.open .lang-list { opacity: 1; visibility: visible; transform: none; transition: opacity .16s ease, transform .16s ease; }
  .lang-option { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border: none; border-radius: 9px;
    background: transparent; color: var(--ink); cursor: pointer; text-align: left; transition: background .12s; }
  .lang-option:hover, .lang-option:focus-visible { background: var(--surface-2); outline: none; }
  .lang-option[aria-selected="true"] { background: var(--accent-soft); }
  .lang-option .flag { width: 24px; height: 17px; border-radius: 4px; }
  .lang-names { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
  .lang-native { font-size: 14px; font-weight: 600; }
  .lang-local { font-size: 12px; color: var(--muted); }
  .lang-check { width: 16px; color: var(--accent); font-weight: 700; text-align: center; }
  .auth-top { display: flex; justify-content: flex-end; margin: -12px -8px 4px 0; }
  .auth-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; font-size: 13px; }
  .auth-links a, .linklike { color: var(--muted); background: none; border: none; padding: 0; font: inherit; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; }
  .auth-links a:hover, .linklike:hover { color: var(--accent); }
  .auth-links a:only-child { margin-left: auto; }
  .reset-title { margin: 0; font-size: 17px; }
  .reset-intro { margin: 0; color: var(--muted); font-size: 13.5px; }

  /* ---------- print / PDF ---------- */
  #printArea { display: none; }
  @media print {
    :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
      --bg: #fff; --surface: #fff; --surface-2: #f7f7f7; --ink: #111; --muted: #444; --faint: #666; --border: #d6d6d6;
      --accent: #9f1d35; --accent-ink: #fff; --accent-soft: #f8e9ec; --ok: #15803d; --ok-soft: #e7f5ec;
      --warn: #b45309; --warn-soft: #fdf1e0; --info: #444; --info-soft: #f1f1f1; --shadow: none;
      color-scheme: light !important;
    }
    @page { margin: 16mm 14mm; }
    html, body { background: #fff !important; height: auto !important; overflow: visible !important; }
    body { display: block !important; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block; color: var(--ink); font-size: 12.5px; width: 100%; max-width: 100%; }
    .print-head { display: flex; gap: 12px; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 16px; }
    .print-head .logo { width: 36px; height: 36px; font-size: 20px; }
    .print-head h1 { margin: 0; font-size: 18px; }
    .print-head p { margin: 2px 0 0; color: var(--muted); font-size: 11.5px; }
    .print-section { margin: 0 0 14px; }
    .print-section.keep { break-inside: avoid; }
    .print-section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 0 0 4px; }
    .print-section .reply { white-space: pre-wrap; line-height: 1.55; overflow-wrap: anywhere; max-width: 100%; padding-right: 4px; }
    #printArea .card { margin-bottom: 10px; }
    #printArea .card, #printArea .books-panel { box-shadow: none; }
    #printArea .books-card, #printArea .card-head, #printArea .breakdown tr { break-inside: avoid; }
    #printArea .books-cards { grid-template-columns: repeat(3, 1fr); }
    #printArea details > summary { list-style: none; font-weight: 600; }
    #printArea details > summary::-webkit-details-marker { display: none; }
    #printArea a { color: var(--ink); text-decoration: none; }
    #printArea button { display: none !important; }
    .print-foot { margin-top: 20px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--faint); }
  }
</style>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* storage unavailable */ } },
};

/* ---------- i18n ---------- */
// Interface text lives in /static/i18n.json; chat replies come translated from the server.
const LANGS = ["ka", "en", "ru", "de", "fr"];
let I18N = {};
let lang = "ka";

function lookup(key, l = lang) {
  const catalog = I18N[l] || {};
  return key in catalog ? catalog[key] : (I18N.en || {})[key] ?? key;
}
const fill = (text, vars) => String(text).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
function t(key, vars = {}, l = lang) { return fill(lookup(key, l), vars); }
const localeOf = (l = lang) => lookup("meta.locale", l);
function tp(key, n, l = lang) {
  const forms = lookup(key, l);
  const form = forms[new Intl.PluralRules(localeOf(l)).select(n)] ?? forms.other ?? forms.many ?? Object.values(forms)[0];
  return fill(form, { n });
}
// Rule/deadline text from the server may be a plain string or {"en": ..., "ka": ...}.
const loc = (text, l = lang) =>
  text === null || text === undefined || typeof text === "string" ? text : (text[l] || text.en || Object.values(text)[0]);

function initialLanguage() {
  const saved = store.get("lang");
  if (LANGS.includes(saved)) return saved;
  for (const pref of navigator.languages || [navigator.language || ""]) {
    const code = pref.toLowerCase().split("-")[0];
    if (LANGS.includes(code)) return code;
  }
  return "ka";
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t("app.name");
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
  for (const node of document.querySelectorAll("[data-i18n-placeholder]")) node.placeholder = t(node.dataset.i18nPlaceholder);
  for (const node of document.querySelectorAll("[data-i18n-aria]")) node.setAttribute("aria-label", t(node.dataset.i18nAria));
  for (const node of document.querySelectorAll("[data-i18n-title]")) {
    node.title = t(node.dataset.i18nTitle);
    node.setAttribute("aria-label", node.title);
  }
  renderLangMenus();
}

async function setLanguage(next, { save = true } = {}) {
  if (!LANGS.includes(next)) return;
  lang = next;
  store.set("lang", next);
  applyStatic();
  setAuthMode(authMode);
  if (resetMode) showReset(resetMode);
  renderStatus();
  renderProfile();
  renderDeadlines();
  renderHistory();
  window.Books?.onLanguageChange();
  window.Reviews?.onLanguageChange();
  window.Pay?.onLanguageChange();
  for (const m of [window.Overview, window.Calendar, window.Companies, window.Banks]) m?.onLanguageChange();
  renderReminders();
  if ($("thread").querySelector(".empty.start")) renderEmpty();
  else if ($("thread").querySelector(".empty.welcome")) renderWelcome();
  if (save && user) {

// Formats come from the catalog rather than the browser's Intl data, which lacks Georgian in some builds,
// and match the server's replies exactly.
function formatAmount(value, l = lang) {
  const text = String(value);
  if (!/^-?\d+(\.\d+)?$/.test(text)) return text;
  // Display only: the engine's exact digits with this language's separators.
  const [whole, frac] = text.replace(/^-/, "").split(".");
  const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, lookup("number.group", l));
  return (text.startsWith("-") ? "-" : "") + grouped + (frac ? lookup("number.decimal", l) + frac : "");
}
const ymd = (iso) => iso.slice(0, 10).split("-").map(Number);
function shortDate(iso) {
  const [, m, d] = ymd(iso);
  return t("date.short", { day: d, month: lookup("date.monthsShort")[m - 1] });
}
function monthYear(iso) {
  const [y, m] = ymd(iso);
  return t("date.monthYear", { month: lookup("date.months")[m - 1], year: y });
}
function fullDate(date) {
  const day = lang === "fr" && date.getDate() === 1 ? "1er" : date.getDate();
  return t("date.full", { day, month: lookup("date.monthsGenitive")[date.getMonth()], year: date.getFullYear() });
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children.flat()) if (child) node.append(child);
  return node;
}

const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const cleanTitle = (s) => capitalize(s.replace(/^(DEMO|დემო):\s*/, ""));
// Matsne titles are often ALL CAPS ("TAX CODE OF GEORGIA").
const titleCase = (s) => s === s.toUpperCase() ? s.toLowerCase().replace(/(^|\s)(\S)/g, (m, sp, ch) => sp + ch.toUpperCase()).replace(/ Of /g, " of ") : s;

// The reply carries the explanation; the card is the receipt: outcome, amount, source, workings.
// Cards follow the reply's language, so a saved conversation keeps reading consistently.
function resultCard(r, l) {
  const tt = (key) => t(key, {}, l);
  const card = el("div", { class: `card ${r.status}` },
    el("div", { class: "card-head" },
      el("span", { class: "card-title", text: cleanTitle(loc(r.title, l)) }),
      el("span", { class: `badge ${r.status}`, text: tt(`card.${r.status}`) }),
      el("span", { class: `badge ${r.verification}`, text: tt(`card.${r.verification}`),
        title: r.reviewed_by ? t("card.reviewedBy", { who: r.reviewed_by }, l) : tt(`card.${r.verification}Tip`) })));

  if (r.amount !== null && r.amount !== undefined) {
    if (r.amount_label) card.append(el("div", { class: "amount-label", text: loc(r.amount_label, l) }));
    card.append(el("div", { class: "amount" }, formatAmount(r.amount, l), el("small", { text: tt("card.currency") })));
  }
  // Steps that didn't apply (e.g. pension for someone outside the scheme) are 0; leave them out.
  const lines = (r.breakdown || []).filter((line) => Number(line.amount) !== 0);
  if (lines.length) {
    card.append(el("table", { class: "breakdown" }, el("tbody", {}, lines.map((line) =>
      el("tr", {}, el("td", { text: loc(line.label, l) }),
        el("td", { text: `${formatAmount(line.amount, l)} ${tt("card.currency")}` }))))));
  }
  card.append(el("div", { class: "source", text: `${tt("card.source")}: ${loc(r.legal_source.citation, l)}` }));

  for (const c of r.citations || []) {
    const pub = /^\d+$/.test(c.publication) ? ` · ${tt("card.publication")} ${c.publication}` : "";
    card.append(el("details", {},
      el("summary", { text: tt("card.excerpt") + (c.language !== l ? tt("card.otherLanguage") : "") }),
      el("blockquote", { text: c.excerpt, lang: c.language }),
      el("a", { class: "cite-link", href: c.url, target: "_blank", rel: "noopener",
        text: `${titleCase(c.title)}${pub} · ${tt("card.openMatsne")}` })));
  }
  if (r.trace && r.trace.length) {
    card.append(el("details", {},
      el("summary", { text: tt("card.how") }),
      el("ol", { class: "trace", lang: "en" }, r.trace.map((step) => el("li", { text: step }))),
      el("div", { class: "source" }, `${tt("card.rule")}: `, el("code", { text: `${r.rule_id} v${r.version}` }))));
  }
  return card;
}

function renderResponse(body, live = true) {
  const l = LANGS.includes(body.extraction.language) ? body.extraction.language : lang;
  const tt = (key) => t(key, {}, l);
  if (live && body.extraction.intent === "list_deadlines") loadDeadlines();
  const parts = [];

  // The reply is the answer. Example questions become chips, so drop their plain-text copies.
  const chips = body.suggestions || [];
  const listed = new Set(chips.map((c) => "- " + c));
  const text = body.reply.split("\n").filter((line) => !listed.has(line.trim())).join("\n").trim();
  parts.push(el("div", { class: "reply", text, lang: l }));

  parts.push(...body.results.map((r) => resultCard(r, l)));
  if (body.draft) parts.push(draftCard(body.draft, live));
  if (chips.length) {
    parts.push(el("div", { class: "chips" }, chips.map((c) =>
      el("button", { class: "chip", type: "button", text: c, onclick: () => ask(c) }))));
  }
  for (const w of body.warnings || []) parts.push(el("div", { class: "callout warning", text: w }));

  const debug = el("pre", { class: "debug", hidden: true,
    text: JSON.stringify({ extraction: body.extraction, results: body.results }, null, 2) });
  parts.push(el("div", { class: "meta" },
    body.used_context ? el("span", { class: "context-note", text: tt("meta.continued") }) : null,
    el("span", { text: `${tt("meta.reply")}: ${tt("source." + body.reply_source)}` }),
    el("span", { text: `${tt("meta.understood")}: ${tt("source." + body.extraction.source)}` }),
    el("button", { class: "debug-toggle", type: "button", text: tt("meta.rawJson"),
      onclick: () => { debug.hidden = !debug.hidden; } }),
    body.results.length ? el("button", { class: "debug-toggle print-btn", type: "button", text: t("print.pdf"),
      onclick: (e) => printAnswer(e.target.closest(".row")) }) : null));
  parts.push(debug);
  addBot(...parts);
}

// Nothing is written until the user presses Save; then it's posted exactly like the Sales & expenses form.
function draftCard(d, live) {
  const status = el("p", { class: "draft-status", role: "status" });
  const direction = el("select", { class: "field", name: "direction" },
    ["income", "expense"].map((v) => el("option", { value: v, text: t(`books.type.${v}`), selected: v === d.direction ? "true" : null })));
  const amount = el("input", { class: "field", name: "amount", inputmode: "decimal", value: d.amount });
  const date = el("input", { class: "field", type: "date", name: "occurred_on", value: d.occurred_on });
  const vat = el("input", { type: "checkbox", name: "vat_included", checked: d.vat_included ? "true" : null });
  const note = el("input", { class: "field", name: "description", maxlength: "1000", value: d.description || "" });
  const save = el("button", { class: "btn primary", type: "button", text: t("draft.save") });
  const drop = el("button", { class: "btn", type: "button", text: t("common.cancel") });
  const fields = [direction, amount, date, vat, note];
  const card = el("div", { class: "draft-card" },
    el("div", { class: "draft-head" }, el("strong", { text: t("draft.title") }), el("span", { class: "draft-currency", text: d.currency })),
    el("div", { class: "draft-grid" },
      el("label", {}, el("span", { text: t("books.form.type") }), direction),
      el("label", {}, el("span", { text: t("books.form.amount") }), amount),
      el("label", {}, el("span", { text: t("books.form.date") }), date),
      el("label", { class: "wide" }, el("span", { text: t("draft.note") }), note),
      d.vat_payer ? el("label", { class: "check wide" }, vat, el("span", { text: t("books.form.vatAuto") })) : null),
    status,
    live ? el("div", { class: "dialog-actions start" }, save, drop) : null);
  const finish = (text, ok) => {
    for (const f of fields) f.disabled = true;
    save.remove(); drop.remove();
    status.className = "draft-status " + (ok ? "ok" : "");
    status.replaceChildren(el("span", { text }),
      ok ? el("button", { class: "link-btn", type: "button", text: t("draft.open"), onclick: () => go("books") }) : null);
  };
  if (!live) for (const f of fields) f.disabled = true;
  save.addEventListener("click", async () => {
    const value = amount.value.replace(/[\s  ]/g, "").replace(",", ".");
    if (!/^\d+(\.\d{1,2})?$/.test(value) || Number(value) <= 0 || !date.value) {
      status.className = "draft-status err"; status.textContent = t("books.form.required"); return;
    }
    save.disabled = true;
    try {
      await api(`/companies/${currentCompany().id}/transactions`, { method: "POST", body: {
        occurred_on: date.value, direction: direction.value, amount: value, currency: d.currency,
        vat_included: d.vat_payer && vat.checked, category: direction.value === "income" ? "sales" : "purchase",
        description: note.value.trim() || null } });
      finish(t("draft.saved"), true);
      window.Books?.onCompanyChange();
      window.Overview?.reload();
      loadDeadlines();
    } catch (err) {
      save.disabled = false;
      if (!(err instanceof AuthError)) { status.className = "draft-status err"; status.textContent = err.message; }
    }
  });
  drop.addEventListener("click", () => finish(t("draft.dropped"), false));
  return card;
}

/* ---------- API ---------- */
class AuthError extends Error {}

function serverText(message) {
  const key = "server." + message;
  return key in (I18N[lang] || {}) ? t(key) : message;
}

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(path, {
    method,
    headers: body === undefined ? {} : { "content-type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401 && !path.startsWith("/auth/")) {
    showAuth();
    throw new AuthError(t("error.signInAgain"));
  }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(errorText(data.detail) || t("error.requestFailed", { status: res.status }));
  return data;
}

function errorText(detail) {
  if (!detail) return "";
  if (typeof detail === "string") return serverText(detail);
  // FastAPI validation errors: [{loc: [..., "field"], msg}]
  return detail.map((d) => {
    const msg = d.msg.replace(/^Value error, /, "");
    const translated = serverText(msg);
    return translated !== msg ? translated : `${d.loc[d.loc.length - 1]}: ${msg}`;
  }).join("; ");
}

/* ---------- state ---------- */
let user = null;
let conversationId = null;

function currentCompany() { return companies.find((c) => c.id === $("company").value); }

/* ---------- sending ---------- */
const input = $("message");
function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
  $("send").disabled = busy || !input.value.trim() || !companies.length;
}
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });

async function send() {
  const message = input.value.trim();
  if (!message || busy || !companies.length) return;
  busy = true;
  input.value = "";
  autosize();
  addUser(message);
  const typing = addBot(el("div", { class: "typing", "aria-label": t("composer.thinking") }, el("span"), el("span"), el("span")));
  try {
    const body = await api(`/companies/${$("company").value}/chat`, {
      method: "POST",
      body: { message, as_of: $("asOf").value, conversation_id: conversationId || undefined, language: lang },
    });
    typing.remove();
    const isNew = conversationId !== body.conversation_id;
    conversationId = body.conversation_id;
    renderResponse(body);
    if (isNew) loadHistory(); else touchHistory();
  } catch (err) {
    typing.remove();
    if (!(err instanceof AuthError)) addBot(el("div", { class: "callout error", text: t("error.generic", { message: err.message }) }));
  } finally {
    busy = false;
    autosize();
    input.focus();
  }
}

/* ---------- conversations ---------- */
function relativeTime(iso) {
  // SQLite (tests) returns naive UTC timestamps; Postgres returns an offset.
  const then = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "Z");
  const minutes = Math.round((Date.now() - then) / 60000);
  if (minutes < 1) return t("history.justNow");
  if (minutes < 60) return tp("time.minutesAgo", minutes);
  const hours = Math.round(minutes / 60);
  if (hours < 24) return tp("time.hoursAgo", hours);
  const days = Math.round(hours / 24);
  if (days < 7) return tp("time.daysAgo", days);
  return fullDate(then);
}

let historyItems = [];

function svgIcon(d) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  const attrs = { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" };
  for (const [k, v] of Object.entries(attrs)) svg.setAttribute(k, v);
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", d);
  svg.append(path);
  return svg;
}

function renderHistory() {
  const box = $("history");
  if (!historyItems.length) {
    box.replaceChildren(el("div", { class: "history-empty", text: t("history.empty") }));
    return;
  }
  box.replaceChildren(...historyItems.map((c) =>
    el("div", { class: "history-item" + (c.id === conversationId ? " active" : ""), role: "button", tabindex: "0",
        onclick: () => openConversation(c.id),
        onkeydown: (e) => { if (e.key === "Enter") openConversation(c.id); } },
      el("div", { class: "h-text" },
        el("div", { class: "h-title", text: c.title }),
        el("div", { class: "h-time", text: relativeTime(c.updated_at) })),
      el("button", { class: "h-del", type: "button", title: t("history.delete"), "aria-label": t("history.deleteAria", { title: c.title }),
          onclick: (e) => { e.stopPropagation(); deleteConversation(c); } },
        svgIcon("M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14")))));
}

async function loadHistory() {
  const company = currentCompany();
  if (!company) { historyItems = []; renderHistory(); return; }
  try {
    historyItems = await api(`/conversations?company_id=${company.id}`);
  } catch { historyItems = []; }
  renderHistory();
}

function touchHistory() {
  const item = historyItems.find((c) => c.id === conversationId);
  if (item) {
    item.updated_at = new Date().toISOString();
    historyItems = [item, ...historyItems.filter((c) => c !== item)];
  }
  renderHistory();
}

async function openConversation(id) {
  go("assistant");
  if (busy) return;
  try {
    const conv = await api(`/conversations/${id}`);
    conversationId = conv.id;
    $("thread").replaceChildren();
    for (const m of conv.messages) {
      if (m.role === "user") addUser(m.content);
      else if (m.payload) renderResponse(m.payload, false);
      else addBot(el("div", { class: "reply", text: m.content }));
    }
    // Re-open with the date the conversation was evaluated at, so follow-ups use the same rule versions.
    const last = [...conv.messages].reverse().find((m) => m.payload && m.payload.as_of);
    if (last) $("asOf").value = last.payload.as_of;
    // Saved messages appear at once; the arrival animation is only for new ones.
    for (const row of $("thread").querySelectorAll(".row")) row.classList.add("restored");
    renderHistory();
    scrollDown();
  } catch (err) {
    if (!(err instanceof AuthError)) addBot(el("div", { class: "callout error", text: t("error.openConversation", { message: err.message }) }));
  }
}

async function deleteConversation(c) {
  if (!confirm(t("history.confirmDelete", { title: c.title }))) return;
  try {
    await api(`/conversations/${c.id}`, { method: "DELETE" });
    if (c.id === conversationId) newChat();
    historyItems = historyItems.filter((x) => x.id !== c.id);
    renderHistory();
  } catch (err) {
    if (!(err instanceof AuthError)) alert(t("error.delete", { message: err.message }));
  }
}

function resetChat() {
  conversationId = null;
  $("asOf").value = new Date().toISOString().slice(0, 10);
  if (companies.length) renderEmpty(); else renderWelcome();
  renderHistory();
}

function newChat() {
  resetChat();
  go("assistant");
  input.focus();
}
$("newChatBtn").addEventListener("click", newChat);

// Georgian has no capitals in running text (upper-casing gives Mtavruli), so only other scripts are upper-cased.
const initialsOf = (name) => name.replace(/[„“"'«»()]/g, "").replace(/^(შპს|სს|ი\/მ|LLC|JSC|IE)\s+/i, "")

let deadlineItems = [];

// "If paid and filed today: penalty interest 4,05 ₾ · late filing fine 45,00 ₾" (amounts from the penalty rules).
function penaltyText(d) {
  if (!d.penalties || !d.penalties.length) return null;
  const money = (v) => `${formatAmount(v)} ${t("card.currency")}`;
  const items = d.penalties.map((p) => t(p.rule_id === "ge.penalty.late_payment" ? "pen.interest" : "pen.fine", { amount: money(p.amount) }));
  return t("pen.ifToday", { items: items.join(" · ") });
}

// The sidebar shows how many open deadlines need attention; the calendar and overview show the dates.

  const urgent = deadlineItems.filter((d) => d.state === "overdue" || d.state === "due_soon").length;
  $("calendarBadge").hidden = !urgent;

// One screen at a time, named in the URL hash so reloads and the back button keep your place.
const VIEWS = ["overview", "assistant", "books", "calendar", "payments", "companies", "banks", "reviews"];
const MODULES = {
  books: () => window.Books, payments: () => window.Pay, reviews: () => window.Reviews, overview: () => window.Overview,
  calendar: () => window.Calendar, companies: () => window.Companies, banks: () => window.Banks,
};
const NEEDS_COMPANY = ["books", "calendar", "payments", "banks"];
let view = null;

function go(name) {
  if (!VIEWS.includes(name)) name = "overview";
  if (NEEDS_COMPANY.includes(name) && !currentCompany()) name = "overview";
  view = name;
  for (const [key, module] of Object.entries(MODULES)) if (key !== name) module()?.hide();
  for (const section of document.querySelectorAll(".view")) section.hidden = section.id !== name;
  MODULES[name]?.()?.show();
  $(name).hidden = false;
  for (const link of document.querySelectorAll("[data-view]")) {
    if (link.dataset.view === name) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
  }
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  $("app").classList.remove("drawer-open");
  closeAccountMenu();
  $(name).scrollTop = 0;
}

for (const link of document.querySelectorAll("[data-view]")) {
  link.addEventListener("click", (e) => { e.preventDefault(); go(link.dataset.view); });
}
$("helpCard").addEventListener("click", () => { go("assistant"); input.focus(); });

/* ---------- RS.ge lookup ---------- */
function legalFormFrom(tin, name) {
  if (tin.length === 11 || /^ი\s?[./]\s?მ/.test(name)) return "IE";
  if (/^სს\s/.test(name)) return "JSC";
  if (/^შპს\s/.test(name)) return "LLC";
  return null;
}

async function rsLookup(button, note, code) {
  const tin = code.replace(/\s/g, "");
  note.className = "rs-note";
  if (!/^(\d{9}|\d{11})$/.test(tin)) {
    note.textContent = t("rs.needCode");
    note.classList.add("err");
    return null;
  }
  button.disabled = true;
  button.classList.add("busy");
  note.textContent = t("rs.checking");
  try {
    return await api(`/rs/taxpayers/${tin}`);
  } catch (err) {
    note.textContent = err instanceof AuthError ? "" : err.message;
    note.classList.add("err");
    return null;
  } finally {
    button.disabled = false;
    button.classList.remove("busy");
  }
}
const rsVat = (r) => t(r.vat_payer ? "rs.vatYes" : "rs.vatNo");
const rsChecked = (r) => fullDate(new Date(r.checked_at));

$("rsLookupBtn").addEventListener("click", async () => {
  const f = companyForm.elements, note = $("rsNote");
  const r = await rsLookup($("rsLookupBtn"), note, f.tax_id.value);
  if (!r) return;
  f.tax_id.value = r.tin;
  f.name.value = r.name;
  const form = legalFormFrom(r.tin, r.name);
  if (form) f.legal_form.value = form;
  f.vat_registered.checked = r.vat_payer;
  $("vatDateField").hidden = !r.vat_payer;
  note.textContent = t("rs.filled", { vat: rsVat(r), date: rsChecked(r) });
  note.classList.add("ok");
});

$("profileRsBtn").addEventListener("click", async () => {
  const note = $("profileRsNote");
  const r = await rsLookup($("profileRsBtn"), note, profileTarget.company.tax_id);
  if (!r) return;
  profileForm.elements.vat_registered.checked = r.vat_payer;
  $("profileVatDate").hidden = !r.vat_payer;
  note.textContent = t("rs.profileResult", { name: r.name, vat: rsVat(r), date: rsChecked(r) });
  note.classList.add("ok");
});

/* ---------- reminders ---------- */
let reminderSettings = null;
let telegramPoll = null;
const REMINDER_DAYS = [0, 1, 2, 3, 5, 7, 14];

function renderReminders() {
  const r = reminderSettings;
  if (!r) return;
  $("remEmailLabel").textContent = t("reminders.email", { email: user ? user.email : "" });
  $("remEmail").checked = r.email_enabled;
  $("remEmail").disabled = !r.email_available;
  $("remEmailOff").hidden = r.email_available;
  $("remTgOff").hidden = r.telegram_available;
  $("remTgActions").hidden = !r.telegram_available;
  $("remTgConnect").hidden = r.telegram_linked;
  $("remTgDisconnect").hidden = !r.telegram_linked;
  const statusBadge = $("remTgStatus");
  statusBadge.textContent = t(r.telegram_linked ? "reminders.telegramLinked" : "reminders.telegramNotLinked");
  statusBadge.className = "review-status" + (r.telegram_linked ? " verified" : "");
  if (r.telegram_linked) $("remTgWaiting").hidden = true;
  $("remDays").replaceChildren(...REMINDER_DAYS.map((n) =>
    new Option(n === 0 ? t("reminders.sameDay") : tp("reminders.daysBefore", n), String(n), false, n === r.days_before)));
}

async function openReminders() {
  $("remNote").textContent = "";
  $("app").classList.remove("drawer-open");
  try {
    reminderSettings = await api("/reminders");
  } catch (err) {
    if (err instanceof AuthError) return;
  }
  renderReminders();
  $("remindersDialog").showModal();
}

async function saveReminders() {
  try {
    reminderSettings = await api("/reminders", { method: "PUT", body: {
      email_enabled: $("remEmail").checked, days_before: Number($("remDays").value) } });
    renderReminders();
    $("remNote").className = "rs-note ok";
    $("remNote").textContent = t("reminders.saved");
  } catch (err) {
    if (!(err instanceof AuthError)) { $("remNote").className = "rs-note err"; $("remNote").textContent = err.message; }
  }
}

$("remindersBtn").addEventListener("click", openReminders);
$("remindersMenuBtn").addEventListener("click", openReminders);
$("remEmail").addEventListener("change", saveReminders);
$("remDays").addEventListener("change", saveReminders);
$("remClose").addEventListener("click", () => $("remindersDialog").close());
$("remindersDialog").addEventListener("close", () => { clearInterval(telegramPoll); telegramPoll = null; });
$("remTgConnect").addEventListener("click", async () => {
  // Open the tab synchronously so pop-up blockers allow it, then point it at the bot link.
  const tab = window.open("", "_blank");
  try {
    const { url } = await api("/reminders/telegram", { method: "POST" });
    if (tab) tab.location = url; else window.location.href = url;
    $("remTgWaiting").hidden = false;
    clearInterval(telegramPoll);
    let tries = 0;
    telegramPoll = setInterval(async () => {
      tries += 1;
      try { reminderSettings = await api("/reminders"); renderReminders(); } catch { /* retry */ }
      if (reminderSettings.telegram_linked || tries > 40) { clearInterval(telegramPoll); telegramPoll = null; }
    }, 3000);
  } catch (err) {
    if (tab) tab.close();
    if (!(err instanceof AuthError)) { $("remNote").className = "rs-note err"; $("remNote").textContent = err.message; }
  }
});
$("remTgDisconnect").addEventListener("click", async () => {
  try {
    await api("/reminders/telegram", { method: "DELETE" });
    reminderSettings = await api("/reminders");
    renderReminders();
  } catch (err) { if (!(err instanceof AuthError)) $("remNote").textContent = err.message; }
});
$("remTest").addEventListener("click", async () => {
  const note = $("remNote");
  try {
    const result = await api("/reminders/test", { method: "POST" });
    const names = (list) => list.map((c) => t(`reminders.channel.${c}`)).join(", ");
    const parts = [];
    if (result.sent.length) parts.push(t("reminders.testSent", { channels: names(result.sent) }));
    if (result.failed.length) parts.push(t("reminders.testFailed", { channels: names(result.failed) }));
    note.className = "rs-note " + (result.failed.length || !result.sent.length ? "err" : "ok");
    note.textContent = parts.join(" ") || t("reminders.testNone");
  } catch (err) {
    if (!(err instanceof AuthError)) { note.className = "rs-note err"; note.textContent = err.message; }
  }
});

  $("authError").textContent = "";
}
// Password reset: "request" asks for the email, "confirm" sets the new password from an emailed #reset= link.
let resetMode = null;
let resetToken = null;

function showReset(mode) {
  resetMode = mode;
  const f = $("resetForm");
  f.hidden = !mode;
  authForm.hidden = !!mode;
  document.querySelector(".tabs").hidden = !!mode;
  $("forgotBtn").hidden = !!mode || !authFeatures.password_reset;
  if (!mode) return;
  $("resetIntro").textContent = t(mode === "request" ? "auth.resetIntro" : "auth.newPasswordIntro");
  $("resetEmailField").hidden = mode !== "request";
  $("resetPasswordField").hidden = mode !== "confirm";
  $("resetSubmit").textContent = t(mode === "request" ? "auth.resetSend" : "auth.resetSave");
  $("resetSubmit").hidden = false;
  $("resetError").textContent = $("resetDone").textContent = "";
  (mode === "request" ? f.elements.email : f.elements.password).focus();
}

let authFeatures = { password_reset: false };
async function loadAuthFeatures() {
  try { authFeatures = await api("/auth/features"); } catch { /* keep defaults */ }
  if (!resetMode) $("forgotBtn").hidden = !authFeatures.password_reset;
}

$("forgotBtn").addEventListener("click", () => {
  showReset("request");
  $("resetForm").elements.email.value = authForm.elements.email.value;
});
$("resetBack").addEventListener("click", () => { showReset(null); setAuthMode("login"); });
$("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = $("resetForm").elements;
  $("resetError").textContent = "";
  $("resetSubmit").disabled = true;
  try {
    if (resetMode === "request") {
      await api("/auth/password-reset", { method: "POST", body: { email: f.email.value.trim(), language: lang } });
      $("resetDone").textContent = t("auth.resetSent");
    } else {
      if (f.password.value.length < 8) { $("resetError").textContent = t("auth.errPassword"); return; }
      await api("/auth/password-reset/confirm", { method: "POST", body: { token: resetToken, password: f.password.value } });
      f.password.value = "";
      history.replaceState(null, "", location.pathname);
      resetToken = null;
      $("resetDone").textContent = t("auth.resetDoneMsg");
      $("resetPasswordField").hidden = true;
      $("resetSubmit").hidden = true;
    }
  } catch (err) {
    $("resetError").textContent = err.message;
  } finally {
    $("resetSubmit").disabled = false;
  }
});

// A reset link pasted into a tab that already has the app open.
window.addEventListener("hashchange", () => {
  const reset = location.hash.match(/^#reset=([\w-]{20,128})$/);
  if (!reset) {
    if (user && VIEWS.includes(location.hash.slice(1)) && location.hash.slice(1) !== view) go(location.hash.slice(1));
    return;
  }
  resetToken = reset[1];
  showAuth();
  showReset("confirm");
});

$("tabLogin").addEventListener("click", () => setAuthMode("login"));
$("tabRegister").addEventListener("click", () => setAuthMode("register"));

function showAuth() {
  window.Books?.hide();
  window.Reviews?.hide();
  window.Pay?.hide();
  user = null;
  conversationId = null;
  $("auth").hidden = false;
  authForm.elements.password.value = "";
  authForm.elements.email.focus();
}

authForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = authForm.elements;
  const body = { email: f.email.value.trim(), password: f.password.value };
  if (authMode === "register") {
    body.full_name = f.full_name.value.trim();
    body.language = lang;
    if (!body.full_name) { $("authError").textContent = t("auth.errName"); return; }
    if (body.password.length < 8) { $("authError").textContent = t("auth.errPassword"); return; }
  }
  $("authSubmit").disabled = true;
  try {
    const me = await api(`/auth/${authMode}`, { method: "POST", body });
    f.password.value = "";
    await startApp(me);
  } catch (err) {
    $("authError").textContent = err.message;
  } finally {
    $("authSubmit").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try { await api("/auth/logout", { method: "POST" }); } catch { /* signing out locally regardless */ }
  companies = [];
  historyItems = [];
  $("thread").replaceChildren();
  showAuth();
});

/* ---------- boot ---------- */
async function startApp(me) {
  user = me;
  $("auth").hidden = true;
  // The account's language wins over this browser's; a first sign-in adopts the browser's choice.
  if (me.language && me.language !== lang) await setLanguage(me.language, { save: false });
  else if (!me.language) api("/auth/me", { method: "PATCH", body: { language: lang } }).catch(() => {});
  $("userName").textContent = me.full_name;
  $("userEmail").textContent = me.email;
  $("initials").textContent = me.full_name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  conversationId = null;
  $("asOf").value = new Date().toISOString().slice(0, 10);
  renderEmpty();
  loadStatus();
  await loadCompanies();
  loadHistory();
  go(location.hash.slice(1));
}

(async function boot() {
  try {
    I18N = await (await fetch("/static/i18n.json")).json();
  } catch {
    I18N = {};
  }
  lang = initialLanguage();
  applyStatic();
  setAuthMode("login");
  loadAuthFeatures();
  const reset = location.hash.match(/^#reset=([\w-]{20,128})$/);
  if (reset) {
    // A link from the reset email: set the new password first, whatever session this browser has.
    resetToken = reset[1];
    showAuth();
    showReset("confirm");
    return;
  }
  try {
    const me = await api("/auth/me");
    await startApp(me);
  } catch {
    if (location.hash === "#register") setAuthMode("register");  // "Start free" on the landing page
    showAuth();
  }
})();
</script>
